                  if (rootContainer != null) {
                      renderKeyboard()
                  }
              }

              // Haptik aloqa (Foydalanuvchi sozlamada yoqqan bo'lsa ishlaydi)
              private fun triggerHaptic(isLongPress: Boolean = false) {
                  if (!::prefs.isInitialized) return
                  if (!prefs.getBoolean(KbConfig.KEY_HAPTIC_ENABLED, true)) return
                  val baseMs = prefs.getInt(KbConfig.KEY_HAPTIC_STRENGTH, 18).toLong()
                  val duration = if (isLongPress) (baseMs + 15L) else baseMs
                  try {
                      val vibrator = getSystemService(Context.VIBRATOR_SERVICE) as? Vibrator
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                          vibrator?.vibrate(VibrationEffect.createOneShot(duration, VibrationEffect.DEFAULT_AMPLITUDE))
                      } else {
                          @Suppress("DEPRECATION")
                          vibrator?.vibrate(duration)
                      }
                  } catch (_: Exception) {}
              }

              // Kursordan oldingi yozilayotgan joriy so'zni olish
              private fun getCurrentWordBeforeCursor(): String {
                  val ic = currentInputConnection ?: return ""
                  val before = ic.getTextBeforeCursor(40, 0)?.toString() ?: return ""
                  var idx = before.length - 1
                  while (idx >= 0) {
                      val c = before[idx]
                      if (c.isLetterOrDigit() || c == 'ʼ' || c == '\'' || c == 'ʻ') {
                          idx--
                      } else {
                          break
                      }
                  }
                  return before.substring(idx + 1)
              }

              // So'z taklifidan birini tanlaganda joriy chala/xato so'zni to'g'risiga almashtirish
              private fun replaceCurrentWordWith(suggestion: String) {
                  val ic = currentInputConnection ?: return
                  val curWord = getCurrentWordBeforeCursor()
                  if (curWord.isNotEmpty()) {
                      ic.deleteSurroundingText(curWord.length, 0)
                  }
                  ic.commitText("$suggestion ", 1)
                  updateSuggestionsBar()
              }

              private fun getActiveTheme(): KbTheme {
                  if (!::prefs.isInitialized) {
                      prefs = getSharedPreferences(KbConfig.PREFS_NAME, Context.MODE_PRIVATE)
                  }
                  val id = prefs.getString(KbConfig.KEY_THEME, "default_dark") ?: "default_dark"
                  return KbConfig.THEMES.find { it.id == id } ?: KbConfig.THEMES.first()
              }

              private fun getActiveLayoutId(): String {
                  if (!::prefs.isInitialized) {
                      prefs = getSharedPreferences(KbConfig.PREFS_NAME, Context.MODE_PRIVATE)
                  }
                  return prefs.getString(KbConfig.KEY_LAYOUT, "f_v1_0") ?: "f_v1_0"
              }

              private fun renderKeyboard() {
                  val container = rootContainer ?: return
                  container.removeAllViews()
                  val theme = getActiveTheme()
                  container.setBackgroundColor(KbConfig.safeColor(theme.boardBg))

                  val padH = if (oneHandedMode == 0) dp(4) else dp(42)
                  container.setPadding(
                      if (oneHandedMode == 2) padH else dp(4),
                      dp(4),
                      if (oneHandedMode == 1) padH else dp(4),
                      dp(10)
                  )

                  // 1. Gboard Top Toolbar Strip
                  container.addView(buildTopToolbar(theme))

                  // 2. O'zbekcha Imlo va So'z Takliflari Qatori (Suggestions Strip)
                  val spellEnabled = prefs.getBoolean(KbConfig.KEY_SPELL_CHECK, true)
                  if (spellEnabled && currentMode == ViewMode.LETTERS) {
                      val sugBox = LinearLayout(this).apply {
                          orientation = LinearLayout.HORIZONTAL
                          gravity = Gravity.CENTER_VERTICAL
                          layoutParams = LinearLayout.LayoutParams(
                              ViewGroup.LayoutParams.MATCH_PARENT,
                              dp(36)
                          ).apply { bottomMargin = dp(4) }
                      }
                      suggestionBarContainer = sugBox
                      container.addView(sugBox)
                      updateSuggestionsBar()
                  } else {
                      suggestionBarContainer = null
                  }

                  // 3. Main Body View
                  when (currentMode) {
                      ViewMode.LETTERS -> buildLettersView(container, theme)
                      ViewMode.SYM1 -> buildSymbolsView(container, theme, isSecondary = false)
                      ViewMode.SYM2 -> buildSymbolsView(container, theme, isSecondary = true)
                      ViewMode.NUMPAD -> buildNumpadView(container, theme)
                      ViewMode.EMOJI -> buildEmojiView(container, theme)
                      ViewMode.QUICK_MENU -> buildQuickMenuView(container, theme)
                      ViewMode.THEME_PICKER -> buildThemePickerView(container, theme)
                      ViewMode.LAYOUT_PICKER -> buildLayoutPickerView(container, theme)
                  }
              }

              private fun updateSuggestionsBar() {
                  val bar = suggestionBarContainer ?: return
                  bar.removeAllViews()
                  val spellEnabled = prefs.getBoolean(KbConfig.KEY_SPELL_CHECK, true)
                  if (!spellEnabled) return

                  val theme = getActiveTheme()
                  val curWord = getCurrentWordBeforeCursor()
                  val suggestions = UzbekDictionary.getSuggestions(curWord, true)

                  if (suggestions.isEmpty()) return

                  suggestions.forEachIndexed { idx, word ->
                      val isPrimary = (idx == 0 && curWord.isNotEmpty() && word.lowercase() != curWord.lowercase())
                      val chip = Button(this).apply {
                          text = if (isPrimary) "✨ $word" else word
                          isAllCaps = false
                          setTextSize(TypedValue.COMPLEX_UNIT_SP, 13f)
                          typeface = if (idx == 0) Typeface.DEFAULT_BOLD else Typeface.DEFAULT
                          setTextColor(KbConfig.safeColor(if (isPrimary) theme.boardBg else theme.keyText))
                          setPadding(dp(8), 0, dp(8), 0)
                          background = GradientDrawable().apply {
                              cornerRadius = dp(14).toFloat()
                              setColor(KbConfig.safeColor(if (isPrimary) theme.accentBg else theme.specialKeyBg))
                          }
                          layoutParams = LinearLayout.LayoutParams(0, dp(32), 1f).apply {
                              setMargins(dp(3), 0, dp(3), 0)
                          }
                          setOnClickListener {
                              triggerHaptic()
                              replaceCurrentWordWith(word)
                          }
                      }
                      bar.addView(chip)
                  }
              }

              private fun buildTopToolbar(theme: KbTheme): View {
                  val bar = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      gravity = Gravity.CENTER_VERTICAL
                      weightSum = 6f
                      layoutParams = LinearLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT,
                          dp(38)
                      ).apply { bottomMargin = dp(2) }
                  }

                  fun toolBtn(icon: String, active: Boolean = false, onClick: () -> Unit): View {
                      return Button(this).apply {
                          text = icon
                          isAllCaps = false
                          setTextSize(TypedValue.COMPLEX_UNIT_SP, 15f)
                          setTextColor(KbConfig.safeColor(if (active) theme.boardBg else theme.keyText))
                          setPadding(0, 0, 0, 0)
                          background = GradientDrawable().apply {
                              cornerRadius = dp(18).toFloat()
                              setColor(if (active) KbConfig.safeColor(theme.accentBg) else Color.TRANSPARENT)
                          }
                          layoutParams = LinearLayout.LayoutParams(0, dp(32), 1f).apply {
                              setMargins(dp(3), 0, dp(3), 0)
                          }
                          setOnClickListener {
                              triggerHaptic()
                              onClick()
                          }
                      }
                  }

                  val isMenuOpen = (currentMode == ViewMode.QUICK_MENU)
                  bar.addView(toolBtn(if (isMenuOpen) "✕" else "⊞", isMenuOpen) {
                      currentMode = if (isMenuOpen) ViewMode.LETTERS else ViewMode.QUICK_MENU
                      renderKeyboard()
                  })
                  bar.addView(toolBtn("😊", currentMode == ViewMode.EMOJI) {
                      currentMode = if (currentMode == ViewMode.EMOJI) ViewMode.LETTERS else ViewMode.EMOJI
                      renderKeyboard()
                  })
                  bar.addView(toolBtn("📋") { pasteFromClipboard() })
                  bar.addView(toolBtn("🎨", currentMode == ViewMode.THEME_PICKER) {
                      currentMode = if (currentMode == ViewMode.THEME_PICKER) ViewMode.LETTERS else ViewMode.THEME_PICKER
                      renderKeyboard()
                  })
                  bar.addView(toolBtn("⌨️", currentMode == ViewMode.LAYOUT_PICKER) {
                      currentMode = if (currentMode == ViewMode.LAYOUT_PICKER) ViewMode.LETTERS else ViewMode.LAYOUT_PICKER
                      renderKeyboard()
                  })
                  bar.addView(toolBtn("⚙️") {
                      try {
                          val intent = Intent(this, SetupActivity::class.java).apply {
                              addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                          }
                          startActivity(intent)
                      } catch (_: Exception) {}
                  })

                  return bar
              }

              private fun buildLettersView(container: LinearLayout, theme: KbTheme) {
                  val layoutId = getActiveLayoutId()
                  val showNumRow = prefs.getBoolean(KbConfig.KEY_NUM_ROW, true)

                  if (showNumRow) {
                      val numRow = LinearLayout(this).apply {
                          orientation = LinearLayout.HORIZONTAL
                          weightSum = 10f
                          layoutParams = LinearLayout.LayoutParams(
                              ViewGroup.LayoutParams.MATCH_PARENT,
                              dp(38)
                          ).apply { bottomMargin = dp(5) }
                      }
                      for (n in listOf("1","2","3","4","5","6","7","8","9","0")) {
                          val btn = createKey(n, 1f, theme, isSpecial = false, heightDp = 38)
                          btn.setOnClickListener {
                              triggerHaptic()
                              commit(n)
                          }
                          numRow.addView(btn)
                      }
                      container.addView(numRow)
                  }

                  val rows = KbConfig.getLayoutRows(layoutId)

                  for (rIdx in 0..1) {
                      val rKeys = rows[rIdx]
                      val rowLayout = LinearLayout(this).apply {
                          orientation = LinearLayout.HORIZONTAL
                          weightSum = rKeys.size.toFloat()
                          layoutParams = LinearLayout.LayoutParams(
                              ViewGroup.LayoutParams.MATCH_PARENT,
                              dp(48)
                          ).apply { bottomMargin = dp(5) }
                      }
                      for (k in rKeys) {
                          val outChar = formatCase(k)
                          val btn = createKey(outChar, 1f, theme, isSpecial = false)
                          btn.setOnClickListener {
                              triggerHaptic()
                              commit(outChar)
                              if (shiftState == 1) {
                                  shiftState = 0
                                  renderKeyboard()
                              }
                          }
                          val alt = longPressMap[k]
                          if (alt != null) {
                              btn.setOnLongClickListener {
                                  triggerHaptic(isLongPress = true)
                                  commit(formatCase(alt))
                                  true
                              }
                          }
                          rowLayout.addView(btn)
                      }
                      container.addView(rowLayout)
                  }

                  val r3Keys = rows[2]
                  val row3Layout = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      weightSum = (r3Keys.size + 2.6f)
                      layoutParams = LinearLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT,
                          dp(48)
                      ).apply { bottomMargin = dp(5) }
                  }

                  val shiftLabel = when (shiftState) {
                      2 -> "⇪"
                      1 -> "⬆"
                      else -> "⇧"
                  }
                  val shiftBtn = createKey(shiftLabel, 1.3f, theme, isSpecial = true, isAccent = (shiftState > 0))
                  shiftBtn.setOnClickListener {
                      triggerHaptic()
                      val now = System.currentTimeMillis()
                      shiftState = if (now - lastShiftTime < 320L) {
                          2
                      } else if (shiftState == 2 || shiftState == 1) {
                          0
                      } else {
                          1
                      }
                      lastShiftTime = now
                      renderKeyboard()
                  }
                  row3Layout.addView(shiftBtn)

                  for (k in r3Keys) {
                      val outChar = formatCase(k)
                      val btn = createKey(outChar, 1f, theme, isSpecial = false)
                      btn.setOnClickListener {
                          triggerHaptic()
                          commit(outChar)
                          if (shiftState == 1) {
                              shiftState = 0
                              renderKeyboard()
                          }
                      }
                      val alt = longPressMap[k]
                      if (alt != null) {
                          btn.setOnLongClickListener {
                              triggerHaptic(isLongPress = true)
                              commit(formatCase(alt))
                              true
                          }
                      }
                      row3Layout.addView(btn)
                  }

                  val delBtn = createKey("⌫", 1.3f, theme, isSpecial = true)
                  delBtn.setOnClickListener {
                      triggerHaptic()
                      deleteChar()
                  }
                  delBtn.setOnLongClickListener {
                      triggerHaptic(isLongPress = true)
                      currentInputConnection?.deleteSurroundingText(12, 0)
                      updateSuggestionsBar()
                      true
                  }
                  row3Layout.addView(delBtn)
                  container.addView(row3Layout)

                  container.addView(buildBottomActionRow(theme))
              }

              private fun buildSymbolsView(container: LinearLayout, theme: KbTheme, isSecondary: Boolean) {
                  val rows = if (isSecondary) sym2Rows else sym1Rows

                  for (rIdx in 0..2) {
                      val rKeys = rows[rIdx]
                      val rowLayout = LinearLayout(this).apply {
                          orientation = LinearLayout.HORIZONTAL
                          weightSum = if (rIdx == 2) 10f else rKeys.size.toFloat()
                          layoutParams = LinearLayout.LayoutParams(
                              ViewGroup.LayoutParams.MATCH_PARENT,
                              dp(48)
                          ).apply { bottomMargin = dp(5) }
                      }

                      for (k in rKeys) {
                          val weight = if (rIdx == 2 && (k == "=\\<" || k == "?123" || k == "DEL")) 1.5f else 1f
                          val isSpec = (k == "=\\<" || k == "?123" || k == "DEL")
                          val label = if (k == "DEL") "⌫" else k
                          val btn = createKey(label, weight, theme, isSpecial = isSpec)
                          btn.setOnClickListener {
                              triggerHaptic()
                              when (k) {
                                  "=\\<" -> { currentMode = ViewMode.SYM2; renderKeyboard() }
                                  "?123" -> { currentMode = ViewMode.SYM1; renderKeyboard() }
                                  "DEL" -> deleteChar()
                                  else -> commit(k)
                              }
                          }
                          rowLayout.addView(btn)
                      }
                      container.addView(rowLayout)
                  }

                  val botRow = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      weightSum = 10f
                      layoutParams = LinearLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT,
                          dp(48)
                      )
                  }

                  botRow.addView(createKey("ABC", 1.5f, theme, isSpecial = true).apply {
                      setOnClickListener { triggerHaptic(); currentMode = ViewMode.LETTERS; renderKeyboard() }
                  })
                  botRow.addView(createKey(if (isSecondary) "<" else ",", 1f, theme, isSpecial = true).apply {
                      setOnClickListener { triggerHaptic(); commit(if (isSecondary) "<" else ",") }
                  })
                  botRow.addView(createKey("1234", 1.2f, theme, isSpecial = true).apply {
                      setOnClickListener { triggerHaptic(); currentMode = ViewMode.NUMPAD; renderKeyboard() }
                  })
                  botRow.addView(createKey(getShortLayoutLabel(), 3.8f, theme, isSpecial = false).apply {
                      setOnClickListener { triggerHaptic(); commit(" ") }
                  })
                  botRow.addView(createKey(if (isSecondary) ">" else ".", 1f, theme, isSpecial = true).apply {
                      setOnClickListener { triggerHaptic(); commit(if (isSecondary) ">" else ".") }
                  })
                  botRow.addView(createKey("↵", 1.5f, theme, isSpecial = true, isAccent = true).apply {
                      setOnClickListener { triggerHaptic(); sendEnter() }
                  })
                  container.addView(botRow)
              }

              private fun buildNumpadView(container: LinearLayout, theme: KbTheme) {
                  val numRows = listOf(
                      listOf("+", "1", "2", "3", "%"),
                      listOf("-", "4", "5", "6", "␣"),
                      listOf("*", "7", "8", "9", "⌫")
                  )
                  for (r in numRows) {
                      val rowLayout = LinearLayout(this).apply {
                          orientation = LinearLayout.HORIZONTAL
                          weightSum = 6f
                          layoutParams = LinearLayout.LayoutParams(
                              ViewGroup.LayoutParams.MATCH_PARENT,
                              dp(52)
                          ).apply { bottomMargin = dp(5) }
                      }
                      r.forEachIndexed { idx, k ->
                          val w = if (idx in 1..3) 1.33f else 1f
                          val isSpec = (idx == 0 || idx == 4)
                          val btn = createKey(k, w, theme, isSpecial = isSpec, heightDp = 52)
                          btn.setOnClickListener {
                              triggerHaptic()
                              when (k) {
                                  "␣" -> commit(" ")
                                  "⌫" -> deleteChar()
                                  else -> commit(k)
                              }
                          }
                          rowLayout.addView(btn)
                      }
                      container.addView(rowLayout)
                  }

                  val bot = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      weightSum = 6f
                      layoutParams = LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, dp(50))
                  }
                  bot.addView(createKey("ABC", 1f, theme, isSpecial = true).apply {
                      setOnClickListener { triggerHaptic(); currentMode = ViewMode.LETTERS; renderKeyboard() }
                  })
                  bot.addView(createKey("/", 0.8f, theme, isSpecial = true).apply {
                      setOnClickListener { triggerHaptic(); commit("/") }
                  })
                  bot.addView(createKey("!?#", 0.9f, theme, isSpecial = true).apply {
                      setOnClickListener { triggerHaptic(); currentMode = ViewMode.SYM1; renderKeyboard() }
                  })
                  bot.addView(createKey("0", 1.5f, theme, isSpecial = false).apply {
                      setOnClickListener { triggerHaptic(); commit("0") }
                  })
                  bot.addView(createKey("=", 0.8f, theme, isSpecial = true).apply {
                      setOnClickListener { triggerHaptic(); commit("=") }
                  })
                  bot.addView(createKey("↵", 1f, theme, isSpecial = true, isAccent = true).apply {
                      setOnClickListener { triggerHaptic(); sendEnter() }
                  })
                  container.addView(bot)
              }

