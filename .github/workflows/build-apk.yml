name: Build Uzbek-F Aragon Ultimate v4.2 (Play Store Ready)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-android-apk:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Repozitoriydan kodlarni olish
        uses: actions/checkout@v4

      - name: 2. Java JDK 17 o'rnatish
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 3. Gradle 8.5 o'rnatish
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: 4. Android SDK litsenziyalarini tasdiqlash
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: 5. Aragon v4.2 Loyihasini Tuzish va Yig'ish
        run: |
          mkdir -p app/src/main/java/com/alharitm/uzbekfkeyboard
          mkdir -p app/src/main/res/xml
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/drawable

          # 1. Release Keystore imzo kaliti
          keytool -genkeypair -v \
            -keystore release-key.jks \
            -alias alharitm_key \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass Alharitm2026! \
            -keypass Alharitm2026! \
            -dname "CN=Sarvarbek Nazarov, OU=Alharitm, O=Alharitm, L=Tashkent, S=Tashkent, C=UZ"

          # 2. settings.gradle
          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "UzbekFKeyboardAragon"
          include(":app")
          EOF

          # 3. Root build.gradle
          cat << 'EOF' > build.gradle
          plugins {
              id 'com.android.application' version '8.2.0' apply false
              id 'org.jetbrains.kotlin.android' version '1.9.20' apply false
          }
          EOF

          # 4. app/build.gradle
          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }

          android {
              namespace 'com.alharitm.uzbekfkeyboard'
              compileSdk 34

              defaultConfig {
                  applicationId "com.alharitm.uzbekfkeyboard"
                  minSdk 23
                  targetSdk 34
                  versionCode 7
                  versionName "4.2.0"
              }

              signingConfigs {
                  release {
                      storeFile file("../release-key.jks")
                      storePassword "Alharitm2026!"
                      keyAlias "alharitm_key"
                      keyPassword "Alharitm2026!"
                  }
              }

              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                      minifyEnabled false
                  }
                  debug {
                      signingConfig signingConfigs.release
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = '17'
              }
          }
          EOF

          # 5. Strings & XML method
          cat << 'EOF' > app/src/main/res/values/strings.xml
          <resources><string name="app_name">Oʻzbek F-Klaviatura Aragon</string></resources>
          EOF

          cat << 'EOF' > app/src/main/res/xml/method.xml
          <?xml version="1.0" encoding="utf-8"?>
          <input-method xmlns:android="http://schemas.android.com/apk/res/android"
              android:settingsActivity="com.alharitm.uzbekfkeyboard.SetupActivity"
              android:supportsSwitchingToNextInputMethod="true">
              <subtype android:label="Oʻzbek F / Lotin (Ö, Ğ, Ş, Ç)" android:imeSubtypeLocale="uz_UZ" android:imeSubtypeMode="keyboard" />
              <subtype android:label="Ўзбек Кирилл (ЙЦУКЕН)" android:imeSubtypeLocale="uz_CYRL_UZ" android:imeSubtypeMode="keyboard" />
          </input-method>
          EOF

          # 6. AndroidManifest.xml
          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.VIBRATE" />
              <application
                  android:label="@string/app_name"
                  android:allowBackup="false"
                  android:supportsRtl="true"
                  android:theme="@android:style/Theme.DeviceDefault.NoActionBar">
                  <activity
                      android:name=".SetupActivity"
                      android:exported="true"
                      android:windowSoftInputMode="stateHidden|adjustResize">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <service
                      android:name=".UzbekFKeyboardService"
                      android:permission="android.permission.BIND_INPUT_METHOD"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.view.InputMethod" />
                      </intent-filter>
                      <meta-data android:name="android.view.im" android:resource="@xml/method" />
                  </service>
              </application>
          </manifest>
          EOF

          # 7. UzbekFKeyboardService.kt (Aragon Edition - Stable & Fast)
          cat << 'EOF' > app/src/main/java/com/alharitm/uzbekfkeyboard/UzbekFKeyboardService.kt
          package com.alharitm.uzbekfkeyboard

          import android.content.Context
          import android.content.SharedPreferences
          import android.graphics.Color
          import android.inputmethodservice.InputMethodService
          import android.os.Build
          import android.os.VibrationEffect
          import android.os.Vibrator
          import android.view.View
          import android.view.ViewGroup
          import android.widget.Button
          import android.widget.LinearLayout
          import android.widget.TextView

          class UzbekFKeyboardService : InputMethodService() {
              private lateinit var prefs: SharedPreferences

              override fun onCreate() {
                  super.onCreate()
                  prefs = getSharedPreferences("alharitm_aragon_prefs", Context.MODE_PRIVATE)
              }

              override fun onCreateInputView(): View {
                  val layout = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setBackgroundColor(Color.parseColor("#1B1B1F"))
                      setPadding(12, 12, 12, 16)
                      layoutParams = ViewGroup.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, 680)
                  }

                  val header = TextView(this).apply {
                      text = "🇺🇿 Oʻzbek F-Klaviatura Aragon v4.2"
                      setTextColor(Color.parseColor("#38BDF8"))
                      textSize = 14f
                      setPadding(8, 6, 8, 8)
                  }
                  layout.addView(header)

                  val keys = listOf("f", "g", "ğ", "o", "q", "d", "r", "n", "h", "p")
                  val row = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      layoutParams = LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, 125)
                  }

                  keys.forEach { char ->
                      val btn = Button(this).apply {
                          text = char
                          setTextColor(Color.WHITE.let { Color.WHITE })
                          textSize = 18f
                          setBackgroundColor(Color.parseColor("#2F3036"))
                          setOnClickListener {
                              vibrate()
                              currentInputConnection?.commitText(char, 1)
                          }
                          layoutParams = LinearLayout.LayoutParams(0, ViewGroup.LayoutParams.MATCH_PARENT, 1f).apply {
                              setMargins(4, 4, 4, 4)
                          }
                      }
                      row.addView(btn)
                  }
                  layout.addView(row)
                  return layout
              }

              private fun vibrate() {
                  try {
                      val v = getSystemService(Context.VIBRATOR_SERVICE) as? Vibrator
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                          v?.vibrate(VibrationEffect.createOneShot(22, VibrationEffect.DEFAULT_AMPLITUDE))
                      } else {
                          @Suppress("DEPRECATION")
                          v?.vibrate(22)
                      }
                  } catch (_: Exception) {}
              }
          }
          EOF

          # 8. SetupActivity.kt
          cat << 'EOF' > app/src/main/java/com/alharitm/uzbekfkeyboard/SetupActivity.py
          EOF

          cat << 'EOF' > app/src/main/java/com/alharitm/uzbekfkeyboard/SetupActivity.kt
          package com.alharitm.uzbekfkeyboard

          import android.app.Activity
          import android.content.Intent
          import android.os.Bundle
          import android.provider.Settings
          import android.widget.Button
          import android.widget.LinearLayout
          import android.widget.TextView

          class SetupActivity : Activity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  val layout = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(48, 80, 48, 48)
                      setBackgroundColor(Color.parseColor("#F4F6FA"))
                  }
                  val title = TextView(this).apply {
                      text = "Oʻzbek F-Klaviatura Aragon\nGoogle Play Ready (v4.2)"
                      textSize = 22f
                      setTextColor(Color.parseColor("#0F172A"))
                  }
                  val btn = Button(this).apply {
                      text = "Klaviaturani Faollashtirish"
                      setOnClickListener { startActivity(Intent(Settings.ACTION_INPUT_METHOD_SETTINGS)) }
                  }
                  layout.addView(title)
                  layout.addView(btn)
                  setContentView(layout)
              }
          }
          EOF

          # APK va AAB to'plamlarini kompilyatsiya qilish
          gradle assembleRelease bundleRelease --no-daemon

      - name: 6. Release APK paketini chiqarish
        uses: actions/upload-artifact@v4
        with:
          name: Alharitm-Uzbek-F-Aragon-v4.2-Release-APK
          path: app/build/outputs/apk/release/*.apk

      - name: 7. Google Play Store AAB paketini chiqarish
        uses: actions/upload-artifact@v4
        with:
          name: Google-Play-Store-Aragon-v4.2-Bundle-AAB
          path: app/build/outputs/bundle/release/*.aab
