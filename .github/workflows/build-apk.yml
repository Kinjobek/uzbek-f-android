              private fun buildQuickMenuView(container: LinearLayout, theme: KbTheme) {
                  val grid = GridLayout(this).apply {
                      columnCount = 2
                      layoutParams = LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, dp(190))
                  }
                  val screenW = resources.displayMetrics.widthPixels.coerceAtLeast(320)
                  val cardW = (screenW - dp(36)) / 2

                  fun menuTile(title: String, onClick: () -> Unit): View {
                      return Button(this).apply {
                          text = title
                          isAllCaps = false
                          setTextSize(TypedValue.COMPLEX_UNIT_SP, 13f)
                          setTextColor(KbConfig.safeColor(theme.keyText))
                          background = GradientDrawable().apply {
                              cornerRadius = dp(22).toFloat()
                              setColor(KbConfig.safeColor(theme.keyBg))
                          }
                          layoutParams = GridLayout.LayoutParams().apply {
                              width = cardW
                              height = dp(54)
                              setMargins(dp(5), dp(5), dp(5), dp(5))
                          }
                          setOnClickListener {
                              triggerHaptic()
                              onClick()
                          }
                      }
                  }

                  val hapticStatus = if (prefs.getBoolean(KbConfig.KEY_HAPTIC_ENABLED, true)) "ON" else "OFF"
                  val spellStatus = if (prefs.getBoolean(KbConfig.KEY_SPELL_CHECK, true)) "ON" else "OFF"

                  grid.addView(menuTile("📳  Vibratsiya: $hapticStatus") {
                      val next = !prefs.getBoolean(KbConfig.KEY_HAPTIC_ENABLED, true)
                      prefs.edit().putBoolean(KbConfig.KEY_HAPTIC_ENABLED, next).apply()
                      renderKeyboard()
                  })
                  grid.addView(menuTile("✨  Imlo tekshiruvi: $spellStatus") {
                      val next = !prefs.getBoolean(KbConfig.KEY_SPELL_CHECK, true)
                      prefs.edit().putBoolean(KbConfig.KEY_SPELL_CHECK, next).apply()
                      currentMode = ViewMode.LETTERS
                      renderKeyboard()
                  })
                  grid.addView(menuTile("🎨  Mavzu (Tema)") { currentMode = ViewMode.THEME_PICKER; renderKeyboard() })
                  grid.addView(menuTile("⌨️  Maket tanlash") { currentMode = ViewMode.LAYOUT_PICKER; renderKeyboard() })
                  grid.addView(menuTile("📱  Bir qoʻlli rejim") {
                      oneHandedMode = (oneHandedMode + 1) % 3
                      currentMode = ViewMode.LETTERS
                      renderKeyboard()
                  })
                  grid.addView(menuTile("⚙️  Barcha Sozlamalar") {
                      try {
                          val intent = Intent(this, SetupActivity::class.java).apply {
                              addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                          }
                          startActivity(intent)
                      } catch (_: Exception) {}
                  })

                  container.addView(grid)
              }

