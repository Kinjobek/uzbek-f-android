              <path android:strokeColor="#FFFFFF" android:strokeWidth="2.2" android:fillColor="#00000000"
                  android:pathData="M71.5,75.5 L70.5,79"/>
          </vector>
          EOF

          cat << 'EOF' > app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@drawable/ic_launcher_background"/>
              <foreground android:drawable="@drawable/ic_launcher_foreground"/>
          </adaptive-icon>
          EOF

          # 6. Strings & XML method
          cat << 'EOF' > app/src/main/res/values/strings.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">Oʻzbek F-Klaviatura Pro</string>
          </resources>
          EOF

          cat << 'EOF' > app/src/main/res/xml/method.xml
          <?xml version="1.0" encoding="utf-8"?>
          <input-method xmlns:android="http://schemas.android.com/apk/res/android"
              android:settingsActivity="com.alharitm.uzbekfkeyboard.SetupActivity"
              android:supportsSwitchingToNextInputMethod="true">
              <subtype
                  android:label="Oʻzbek F / Lotin (Ö, Ğ, Ş, Ç)"
                  android:imeSubtypeLocale="uz_UZ"
                  android:imeSubtypeMode="keyboard" />
              <subtype
                  android:label="Ўзбек Кирилл (ЙЦУКЕН)"
                  android:imeSubtypeLocale="uz_CYRL_UZ"
                  android:imeSubtypeMode="keyboard" />
          </input-method>
          EOF

          # 7. AndroidManifest.xml
          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.VIBRATE" />
              <application
                  android:label="@string/app_name"
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher"
                  android:allowBackup="false"
                  android:supportsRtl="true"
                  android:theme="@android:style/Theme.DeviceDefault.NoActionBar">
                  <activity
                      android:name=".SetupActivity"
                      android:exported="true"
                      android:windowSoftInputMode="stateHidden|adjustResize">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <service
                      android:name=".UzbekFKeyboardService"
                      android:label="@string/app_name"
                      android:permission="android.permission.BIND_INPUT_METHOD"
                      android:exported="true"
                      android:directBootAware="true">
                      <intent-filter>
                          <action android:name="android.view.InputMethod" />
                      </intent-filter>
                      <meta-data
                          android:name="android.view.im"
                          android:resource="@xml/method" />
                  </service>
              </application>
          </manifest>
          EOF

