                  "özbekiston" to Triple("Uzbekistan", "Özbekistan", "Узбекистан"),
                  "dastur" to Triple("Application", "Uygulama", "Программа"),
                  "klaviatura" to Triple("Keyboard", "Klavye", "Клавиатура"),
                  "taʼlim" to Triple("Education", "Eğitim", "Образование"),
                  "maʼlumot" to Triple("Information", "Bilgi", "Информация"),
                  "töğri" to Triple("Correct", "Doğru", "Правильно")
              )

              fun latinToCyrillic(text: String): String {
                  var s = text
                  val pairs = listOf(
                      "Oʻ" to "Ў", "oʻ" to "ў", "O'" to "Ў", "o'" to "ў", "Ö" to "Ў", "ö" to "ў",
                      "Gʻ" to "Ғ", "gʻ" to "ғ", "G'" to "Ғ", "g'" to "ғ", "Ğ" to "Ғ", "ğ" to "ғ",
                      "Sh" to "Ш", "SH" to "Ш", "sh" to "ш", "Ş" to "Ш", "ş" to "ш",
                      "Ch" to "Ч", "CH" to "Ч", "ch" to "ч", "Ç" to "Ч", "ç" to "ч",
                      "Yo" to "Ё", "yo" to "ё", "Yu" to "Ю", "yu" to "ю",
                      "Ya" to "Я", "ya" to "я", "Ye" to "Е", "ye" to "е",
                      "ʼ" to "ъ", "'" to "ъ"
                  )
                  for ((lat, cyr) in pairs) s = s.replace(lat, cyr)
                  val charMap = mapOf(
                      'A' to 'А', 'a' to 'а', 'B' to 'Б', 'b' to 'б', 'D' to 'Д', 'd' to 'д',
                      'E' to 'Э', 'e' to 'е', 'F' to 'Ф', 'f' to 'ф', 'G' to 'Г', 'g' to 'г',
                      'H' to 'Ҳ', 'h' to 'ҳ', 'I' to 'И', 'i' to 'и', 'J' to 'Ж', 'j' to 'ж',
                      'K' to 'К', 'k' to 'к', 'L' to 'Л', 'l' to 'л', 'M' to 'М', 'm' to 'м',
                      'N' to 'Н', 'n' to 'н', 'O' to 'О', 'o' to 'о', 'P' to 'П', 'p' to 'п',
                      'Q' to 'Қ', 'q' to 'қ', 'R' to 'Р', 'r' to 'р', 'S' to 'С', 's' to 'с',
                      'T' to 'Т', 't' to 'т', 'U' to 'У', 'u' to 'у', 'V' to 'В', 'v' to 'в',
                      'X' to 'Х', 'x' to 'х', 'Y' to 'Й', 'y' to 'й', 'Z' to 'З', 'z' to 'з'
                  )
                  val sb = StringBuilder()
                  for (c in s) sb.append(charMap[c] ?: c)
                  return sb.toString()
              }

              fun cyrillicToNewLatin(text: String): String {
                  val map = mapOf(
                      'А' to "A", 'а' to "a", 'Б' to "B", 'б' to "b", 'В' to "V", 'в' to "v",
                      'Г' to "G", 'г' to "g", 'Д' to "D", 'д' to "d", 'Е' to "E", 'е' to "e",
                      'Ё' to "Yo", 'ё' to "yo", 'Ж' to "J", 'ж' to "j", 'З' to "Z", 'з' to "z",
                      'И' to "I", 'и' to "i", 'Й' to "Y", 'й' to "y", 'К' to "K", 'к' to "k",
                      'Л' to "L", 'л' to "l", 'М' to "M", 'м' to "m", 'Н' to "N", 'н' to "n",
                      'О' to "O", 'о' to "o", 'П' to "P", 'п' to "p", 'Р' to "R", 'р' to "r",
                      'С' to "S", 'с' to "s", 'Т' to "T", 'т' to "t", 'У' to "U", 'у' to "u",
                      'Ф' to "F", 'ф' to "f", 'Х' to "X", 'х' to "x", 'Ц' to "Ts", 'ц' to "ts",
                      'Ч' to "Ç", 'ч' to "ç", 'Ш' to "Ş", 'ш' to "ş", 'Ъ' to "ʼ", 'ъ' to "ʼ",
                      'Ь' to "", 'ь' to "", 'Э' to "E", 'э' to "e", 'Ю' to "Yu", 'ю' to "yu",
                      'Я' to "Ya", 'я' to "ya", 'Ў' to "Ö", 'ў' to "ö", 'Қ' to "Q", 'қ' to "q",
                      'Ғ' to "Ğ", 'ғ' to "ğ", 'Ҳ' to "H", 'ҳ' to "h"
                  )
                  val sb = StringBuilder()
                  for (c in text) sb.append(map[c] ?: c.toString())
                  return sb.toString()
              }
          }

          class TouchDotKeyView(
              context: Context,
              val rawKey: String,
              val displayChar: String,
              val subHint: String?,
              val theme: KbTheme,
              val textSp: Float
          ) : View(context) {

              var isPressedDown = false
                  set(value) {
                      field = value
                      invalidate()
                  }

              private val bgPaint = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                  color = KbConfig.safeColor(theme.keyBg)
              }
              private val shadowPaint = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                  color = Color.argb(75, 0, 0, 0)
              }
              private val textPaint = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                  color = KbConfig.safeColor(theme.keyText)
                  textAlign = Paint.Align.CENTER
                  typeface = Typeface.create("sans-serif-medium", Typeface.NORMAL)
                  textSize = TypedValue.applyDimension(TypedValue.COMPLEX_UNIT_SP, textSp, resources.displayMetrics)
              }
              private val hintPaint = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                  color = KbConfig.safeColor(theme.keyText)
                  alpha = 135
                  textAlign = Paint.Align.RIGHT
                  typeface = Typeface.DEFAULT_BOLD
                  textSize = TypedValue.applyDimension(TypedValue.COMPLEX_UNIT_SP, 9.5f, resources.displayMetrics)
              }
              private val dotPaint = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                  color = if (theme.isLight) Color.argb(110, 100, 116, 139) else Color.argb(145, 148, 163, 184)
              }
              private val rect = RectF()
              private val shadowRect = RectF()

              override fun onDraw(canvas: Canvas) {
                  super.onDraw(canvas)
                  val w = width.toFloat()
                  val h = height.toFloat()
                  val corner = dp(7f)

                  shadowRect.set(0f, dp(1.5f), w, h)
                  canvas.drawRoundRect(shadowRect, corner, corner, shadowPaint)

                  rect.set(0f, 0f, w, h - dp(1.5f))
                  canvas.drawRoundRect(rect, corner, corner, bgPaint)

                  if (isPressedDown) {
                      val radius = minOf(w, h) * 0.24f
                      canvas.drawCircle(w / 2f, (h - dp(1.5f)) / 2f, radius, dotPaint)
                  } else {
                      if (!subHint.isNullOrEmpty()) {
                          canvas.drawText(subHint, w - dp(4f), dp(11f), hintPaint)
                      }
                      val fm = textPaint.fontMetrics
                      val textY = (h - dp(1.5f)) / 2f - (fm.ascent + fm.descent) / 2f
                      canvas.drawText(displayChar, w / 2f, textY, textPaint)
                  }
              }

              private fun dp(v: Float): Float =
                  TypedValue.applyDimension(TypedValue.COMPLEX_UNIT_DIP, v, resources.displayMetrics)
          }

          class UzbekFKeyboardService : InputMethodService() {

              private lateinit var prefs: SharedPreferences
              private var rootContainer: FrameLayout? = null
              private var isShifted = false
              private var isCapsLock = false
              private var lastShiftClickTime = 0L
              private var lastSpaceClickTime = 0L
              private var isPasswordInput = false

              private var lastAutoReplacedOriginal: String? = null
              private var lastAutoReplacedTarget: String? = null

              private var keyPreviewPopup: PopupWindow? = null
              private var keyPreviewCharTv: TextView? = null
              private var keyPreviewDotsTv: TextView? = null
              private var keyPreviewCard: LinearLayout? = null

              private val deleteHandler = Handler(Looper.getMainLooper())
              private var isDeleting = false

              private val deleteRunnable = object : Runnable {
                  override fun run() {
                      if (isDeleting) {
                          handleBackspace()
                          vibrateKey(true)
                          deleteHandler.postDelayed(this, 55)
                      }
                  }
              }

              enum class ViewMode {
                  LETTERS, SYMBOLS_1, SYMBOLS_2, NUMPAD, EMOJI, QUICK_MENU, THEME_PICKER, TRANSLATOR
              }
              private var currentMode = ViewMode.LETTERS

              override fun onCreate() {
                  super.onCreate()
                  prefs = getSharedPreferences(KbConfig.PREFS_NAME, Context.MODE_PRIVATE)
              }

              override fun onCreateInputView(): View {
                  val container = FrameLayout(this).apply {
                      layoutParams = ViewGroup.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT,
                          ViewGroup.LayoutParams.WRAP_CONTENT
                      )
                  }
                  rootContainer = container
                  renderKeyboardUI()
                  return container
              }

              override fun onStartInputView(info: EditorInfo?, restarting: Boolean) {
                  super.onStartInputView(info, restarting)
                  dismissKeyPreview()
                  isPasswordInput = detectPasswordInput(info)
                  lastAutoReplacedOriginal = null
                  lastAutoReplacedTarget = null

                  if (info != null) {
                      val inputClass = info.inputType and InputType.TYPE_MASK_CLASS
                      currentMode = if (inputClass == InputType.TYPE_CLASS_NUMBER || inputClass == InputType.TYPE_CLASS_PHONE) {
                          ViewMode.NUMPAD
                      } else {
                          ViewMode.LETTERS
                      }
                  }
                  if (!isPasswordInput) updateShiftStateFromEditor()
                  if (rootContainer != null) renderKeyboardUI()
              }

              override fun onFinishInputView(finishingInput: Boolean) {
                  super.onFinishInputView(finishingInput)
                  dismissKeyPreview()
              }

              private fun detectPasswordInput(info: EditorInfo?): Boolean {
                  if (info == null) return false
                  val inputType = info.inputType
                  val variation = inputType and InputType.TYPE_MASK_VARIATION
                  val clazz = inputType and InputType.TYPE_MASK_CLASS

                  if (clazz == InputType.TYPE_CLASS_TEXT) {
                      if (variation == InputType.TYPE_TEXT_VARIATION_PASSWORD ||
                          variation == InputType.TYPE_TEXT_VARIATION_VISIBLE_PASSWORD ||
                          variation == InputType.TYPE_TEXT_VARIATION_WEB_PASSWORD
                      ) return true
                  }
                  if (clazz == InputType.TYPE_CLASS_NUMBER && variation == InputType.TYPE_NUMBER_VARIATION_PASSWORD) {
                      return true
                  }
                  return false
              }

              private fun getActiveTheme(): KbTheme {
                  val id = prefs.getString(KbConfig.KEY_THEME, "default_dark") ?: "default_dark"
                  return KbConfig.THEMES.find { it.id == id } ?: KbConfig.THEMES.first()
              }

              private fun getActiveLayout(): KbLayoutDef {
                  val id = prefs.getString(KbConfig.KEY_LAYOUT, "uz_f_v10") ?: "uz_f_v10"
                  return KbConfig.LAYOUTS.find { it.id == id } ?: KbConfig.LAYOUTS.first()
              }

              private fun showKeyPreviewBubble(anchor: View, text: String, hasAlts: Boolean, theme: KbTheme) {
                  if (!prefs.getBoolean(KbConfig.KEY_POPUP_PREVIEW, true) || isPasswordInput) return
                  try {
                      if (keyPreviewPopup == null) {
                          val card = LinearLayout(this).apply {
                              orientation = LinearLayout.VERTICAL
                              gravity = Gravity.CENTER
                              setPadding(dp(12), dp(6), dp(12), dp(6))
                          }
                          val charTv = TextView(this).apply {
                              gravity = Gravity.CENTER
                              typeface = Typeface.create("sans-serif-medium", Typeface.BOLD)
                              setTextSize(TypedValue.COMPLEX_UNIT_SP, 27f)
                          }
                          val dotsTv = TextView(this).apply {
                              text = "•••"
                              gravity = Gravity.CENTER
                              setTextSize(TypedValue.COMPLEX_UNIT_SP, 9f)
                          }
                          card.addView(charTv)
                          card.addView(dotsTv)

                          keyPreviewCard = card
                          keyPreviewCharTv = charTv
                          keyPreviewDotsTv = dotsTv

                          keyPreviewPopup = PopupWindow(card, dp(56), dp(66), false).apply {
                              isClippingEnabled = false
                              isTouchable = false
                          }
                      }

                      val popBgColor = if (theme.isLight) Color.WHITE else KbConfig.safeColor("#3C4043")
                      keyPreviewCard?.background = GradientDrawable().apply {
                          setColor(popBgColor)
                          cornerRadius = dp(12).toFloat()
                          setStroke(dp(1), KbConfig.safeColor(theme.accentBg))
                      }
                      keyPreviewCharTv?.setTextColor(KbConfig.safeColor(theme.keyText))
                      keyPreviewCharTv?.text = text
                      keyPreviewDotsTv?.setTextColor(KbConfig.safeColor(theme.accentBg))
                      keyPreviewDotsTv?.visibility = if (hasAlts) View.VISIBLE else View.GONE

                      val loc = IntArray(2)
                      anchor.getLocationInWindow(loc)
                      val popupW = dp(56)
                      val popupH = dp(66)
                      val x = loc[0] + (anchor.width - popupW) / 2
                      val y = (loc[1] - popupH + dp(4)).coerceAtLeast(0)

                      val popup = keyPreviewPopup!!
                      if (popup.isShowing) {
                          popup.update(x, y, popupW, popupH)
                      } else {
                          popup.showAtLocation(anchor, Gravity.NO_GRAVITY, x, y)
                      }
                  } catch (_: Exception) {}
              }

              private fun dismissKeyPreview() {
                  try {
                      keyPreviewPopup?.dismiss()
                  } catch (_: Exception) {}
              }

              fun renderKeyboardUI() {
