name: Build Uzbek-F Android Pro v3.0 (Play Store Ready APK & AAB)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-android-apk:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Repozitoriydan kodlarni olish
        uses: actions/checkout@v4

      - name: 2. Java JDK 17 o'rnatish
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 3. Gradle 8.5 o'rnatish
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: 4. Ilova ikonasi, Lug'at, Imlo tekshiruvi va Manba kodlarini yaratish
        run: |
          mkdir -p app/src/main/java/com/alharitm/uzbekfkeyboard
          mkdir -p app/src/main/res/xml
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/mipmap-anydpi-v26

          # 1. ILOVA IKONASI ORQA FONI (O'zbekiston bayrog'i chiziqlari: Moviy, Qizil, Oq, Yashil)
          cat << 'EOF' > app/src/main/res/drawable/ic_launcher_background.xml
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <!-- Moviy osmon qismi -->
              <path android:fillColor="#0099B5" android:pathData="M0,0h108v36h-108z"/>
              <!-- Yuqori qizil chiziq -->
              <path android:fillColor="#CE1126" android:pathData="M0,36h108v2.5h-108z"/>
              <!-- O'rta oq qism -->
              <path android:fillColor="#FFFFFF" android:pathData="M0,38.5h108v31h-108z"/>
              <!-- Quyi qizil chiziq -->
              <path android:fillColor="#CE1126" android:pathData="M0,69.5h108v2.5h-108z"/>
              <!-- Yashil qism -->
              <path android:fillColor="#1EB53A" android:pathData="M0,72h108v36h-108z"/>
          </vector>
          EOF

          # 2. ILOVA IKONASI OLD QISMI (Markaziy qalqon va 4 ta kvadrat ichida Ö, Ğ, Ş, Ç harflari)
          cat << 'EOF' > app/src/main/res/drawable/ic_launcher_foreground.xml
