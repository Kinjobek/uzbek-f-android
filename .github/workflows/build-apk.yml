              private fun buildBottomActionRow(theme: KbTheme): View {
                  val row = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      weightSum = 10f
                      layoutParams = LinearLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT,
                          dp(48)
                      )
                  }

                  val showComma = prefs.getBoolean(KbConfig.KEY_COMMA_BTN, true)
                  val showPeriod = prefs.getBoolean(KbConfig.KEY_PERIOD_BTN, true)
                  val showEmoji = prefs.getBoolean(KbConfig.KEY_EMOJI_BTN, true)
                  val showLang = prefs.getBoolean(KbConfig.KEY_LANG_BTN, false)

                  var spaceWeight = 4.6f
                  if (!showComma) spaceWeight += 0.9f
                  if (!showPeriod) spaceWeight += 0.9f
                  if (!showEmoji && !showLang) spaceWeight += 1.0f

                  row.addView(createKey("?123", 1.4f, theme, isSpecial = true).apply {
                      setOnClickListener {
                          it.performHapticFeedback(HapticFeedbackConstants.KEYBOARD_TAP)
                          currentMode = ViewMode.SYM1
                          renderKeyboard()
                      }
                  })

                  if (showComma) {
                      row.addView(createKey(",", 0.9f, theme, isSpecial = true).apply {
                          setOnClickListener {
                              it.performHapticFeedback(HapticFeedbackConstants.KEYBOARD_TAP)
                              commit(",")
                          }
                      })
                  }

                  if (showEmoji) {
                      row.addView(createKey("😊", 1.0f, theme, isSpecial = true).apply {
                          setOnClickListener {
                              it.performHapticFeedback(HapticFeedbackConstants.KEYBOARD_TAP)
                              currentMode = ViewMode.EMOJI
                              renderKeyboard()
                          }
                      })
                  } else if (showLang) {
                      row.addView(createKey("🌐", 1.0f, theme, isSpecial = true).apply {
                          setOnClickListener {
                              it.performHapticFeedback(HapticFeedbackConstants.KEYBOARD_TAP)
                              cycleLayout()
                          }
                      })
                  }

                  val spaceBtn = createKey(getShortLayoutLabel(), spaceWeight, theme, isSpecial = false)
                  spaceBtn.setOnClickListener {
                      it.performHapticFeedback(HapticFeedbackConstants.KEYBOARD_TAP)
                      val now = System.currentTimeMillis()
                      if (now - lastSpaceTime < 300L) {
                          currentInputConnection?.deleteSurroundingText(1, 0)
                          commit(". ")
                          shiftState = 1
                          renderKeyboard()
                      } else {
                          commit(" ")
                      }
                      lastSpaceTime = now
                  }
                  spaceBtn.setOnLongClickListener {
                      it.performHapticFeedback(HapticFeedbackConstants.LONG_PRESS)
                      cycleLayout()
                      true
                  }
                  row.addView(spaceBtn)

                  if (showPeriod) {
                      row.addView(createKey(".", 0.9f, theme, isSpecial = true).apply {
                          setOnClickListener {
                              it.performHapticFeedback(HapticFeedbackConstants.KEYBOARD_TAP)
                              commit(".")
                          }
                          setOnLongClickListener {
                              it.performHapticFeedback(HapticFeedbackConstants.LONG_PRESS)
                              commit("?")
                              true
                          }
                      })
                  }

                  row.addView(createKey("↵", 1.4f, theme, isSpecial = true, isAccent = true).apply {
                      setOnClickListener {
                          it.performHapticFeedback(HapticFeedbackConstants.KEYBOARD_TAP)
                          sendEnter()
                      }
                  })

                  return row
              }

              private fun cycleLayout() {
                  val keys = KbConfig.LAYOUT_NAMES.keys.toList()
                  val cur = getActiveLayoutId()
                  val nextIdx = (keys.indexOf(cur) + 1) % keys.size
                  prefs.edit().putString(KbConfig.KEY_LAYOUT, keys[nextIdx]).apply()
                  renderKeyboard()
              }

              private fun getShortLayoutLabel(): String {
                  return when (getActiveLayoutId()) {
                      "f_v1_1" -> "Oʻzbek F (v1.1)"
                      "f_v1_2" -> "Oʻzbek F (v1.2)"
                      "turkish_f" -> "Türkçe F"
                      "uz_qwerty_new" -> "Oʻzbek QWERTY"
                      else -> "Oʻzbek F"
                  }
              }

              private fun formatCase(ch: String): String {
                  if (ch == "ʼ") return "ʼ"
                  return if (shiftState > 0) ch.uppercase() else ch
              }

              private fun createKey(
                  label: String,
                  weight: Float,
                  theme: KbTheme,
                  isSpecial: Boolean,
                  isAccent: Boolean = false,
                  heightDp: Int = 48
              ): Button {
                  val scale = prefs.getInt(KbConfig.KEY_FONT_SCALE, 100) / 100f
                  val baseSp = if (label.length > 1) 13f else 18f

                  return Button(this).apply {
                      text = label
                      isAllCaps = false
                      setTextSize(TypedValue.COMPLEX_UNIT_SP, baseSp * scale)
                      typeface = Typeface.create("sans-serif-medium", if (isSpecial) Typeface.BOLD else Typeface.NORMAL)
                      setTextColor(
                          KbConfig.safeColor(
                              if (isAccent) theme.boardBg else theme.keyText
                          )
                      )
                      gravity = Gravity.CENTER
                      setPadding(0, 0, 0, 0)

                      background = GradientDrawable().apply {
                          cornerRadius = dp(if (isAccent || label == "?123" || label == "ABC") 22 else 8).toFloat()
                          setColor(
                              KbConfig.safeColor(
                                  when {
                                      isAccent -> theme.accentBg
                                      isSpecial -> theme.specialKeyBg
                                      else -> theme.keyBg
                                  }
                              )
                          )
                      }

                      layoutParams = LinearLayout.LayoutParams(
                          0,
                          dp(heightDp),
                          weight
                      ).apply {
                          val m = dp(2)
                          setMargins(m, 0, m, 0)
                      }
                  }
              }

              private fun pasteFromClipboard() {
                  try {
                      val cm = getSystemService(Context.CLIPBOARD_SERVICE) as? ClipboardManager
                      val text = cm?.primaryClip?.getItemAt(0)?.coerceToText(this)?.toString()
                      if (!text.isNullOrEmpty()) {
                          commit(text)
                      }
                  } catch (_: Exception) {}
              }

              private fun commit(text: String) {
                  currentInputConnection?.commitText(text, 1)
              }

              private fun deleteChar() {
                  val ic = currentInputConnection ?: return
                  val sel = ic.getSelectedText(0)
                  if (sel.isNullOrEmpty()) {
                      ic.deleteSurroundingText(1, 0)
                  } else {
                      ic.commitText("", 1)
                  }
              }

              private fun sendEnter() {
                  val ic = currentInputConnection ?: return
                  val opts = currentInputEditorInfo?.imeOptions ?: 0
                  val action = opts and EditorInfo.IME_MASK_ACTION
                  if (action in listOf(
                          EditorInfo.IME_ACTION_SEARCH,
                          EditorInfo.IME_ACTION_GO,
                          EditorInfo.IME_ACTION_SEND,
                          EditorInfo.IME_ACTION_DONE
                      )
                  ) {
                      ic.performEditorAction(action)
                  } else {
                      sendDownUpKeyEvents(KeyEvent.KEYCODE_ENTER)
                  }
              }

              private fun dp(v: Int): Int = (v * resources.displayMetrics.density).toInt()
          }
          EOF

          # method.xml yaratish
          cat << 'EOF' > app/src/main/res/xml/method.xml
