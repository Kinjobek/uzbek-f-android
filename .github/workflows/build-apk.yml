              private fun buildSuggestionsStrip(theme: KbTheme): View {
                  val strip = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      gravity = Gravity.CENTER_VERTICAL
                      setPadding(dp(6), dp(2), dp(6), dp(4))
                      layoutParams = LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, dp(38))
                  }

                  if (isPasswordInput) {
                      val shieldPill = TextView(this).apply {
                          text = "🔒 Maxfiy parol rejimi  ••••••••"
                          setTextColor(KbConfig.safeColor(theme.accentBg))
                          setTextSize(TypedValue.COMPLEX_UNIT_SP, 13.5f)
                          typeface = Typeface.DEFAULT_BOLD
                          gravity = Gravity.CENTER
                          layoutParams = LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.MATCH_PARENT)
                      }
                      strip.addView(shieldPill)
                      return strip
                  }

                  val currentWord = getCurrentWordBeingTyped()

                  if (currentWord.isEmpty() && lastAutoReplacedOriginal != null && lastAutoReplacedTarget != null) {
                      val orig = lastAutoReplacedOriginal!!
                      val targ = lastAutoReplacedTarget!!
                      val undoBtn = Button(this).apply {
                          text = "↶ Geri al ($orig)"
                          isAllCaps = false
                          setTextSize(TypedValue.COMPLEX_UNIT_SP, 13.5f)
                          setTextColor(KbConfig.safeColor(theme.keyText))
                          background = roundedBg(theme.keyBg, 16f)
                          setPadding(dp(16), 0, dp(16), 0)
                          layoutParams = LinearLayout.LayoutParams(ViewGroup.LayoutParams.WRAP_CONTENT, dp(30)).apply {
                              gravity = Gravity.CENTER
                          }
                          setOnClickListener {
                              vibrateKey()
                              undoLastAutoReplace(orig, targ)
                          }
                      }
                      strip.gravity = Gravity.CENTER
                      strip.addView(undoBtn)
                      return strip
                  }

                  val suggestions = computeSuggestions(currentWord)
                  suggestions.take(3).forEachIndexed { idx, word ->
                      val isPrimary = idx == 0 && currentWord.isNotEmpty() && word.lowercase() != currentWord.lowercase()
                      val chip = Button(this).apply {
                          text = if (isPrimary) "✨ $word" else word
                          isAllCaps = false
                          setTextSize(TypedValue.COMPLEX_UNIT_SP, 14f)
                          typeface = if (idx == 0) Typeface.DEFAULT_BOLD else Typeface.DEFAULT
                          setTextColor(if (isPrimary) KbConfig.safeColor(theme.accentText) else KbConfig.safeColor(theme.keyText))
                          background = if (isPrimary) roundedBg(theme.accentBg, 10f) else roundedBg(theme.specKeyBg, 8f)
                          setPadding(dp(8), 0, dp(8), 0)
                          layoutParams = LinearLayout.LayoutParams(0, dp(30), 1f).apply {
                              setMargins(dp(3), 0, dp(3), 0)
                          }
                          setOnClickListener {
                              vibrateKey()
                              replaceCurrentWordWith(word, saveUndo = currentWord.isNotEmpty())
                          }
                      }
                      strip.addView(chip)
                  }
                  return strip
              }

              private fun getCurrentWordBeingTyped(): String {
                  if (isPasswordInput) return ""
                  val ic = currentInputConnection ?: return ""
                  val before = ic.getTextBeforeCursor(35, 0)?.toString() ?: return ""
                  val lastSpace = before.indexOfLast { it.isWhitespace() || it in ".,!?;:()\"-" }
                  return if (lastSpace == -1) before else before.substring(lastSpace + 1)
              }

              private fun computeSuggestions(word: String): List<String> {
                  val layout = getActiveLayout()
                  if (word.isBlank()) {
                      return if (layout.isCyrillic) listOf("ассалому", "ўзбекистон", "яхши")
                      else listOf("assalomu", "özbekiston", "yaxşi")
                  }
                  val lower = word.lowercase()
                  val isCapitalized = word.first().isUpperCase()
                  val results = mutableListOf<String>()

                  if (layout.isCyrillic) {
                      KbConfig.CYRILLIC_AUTO_FIX[lower]?.let { results.add(it) }
                      val converted = KbConfig.latinToCyrillic(lower)
                      if (converted != lower) results.add(converted)
                      KbConfig.CYRILLIC_DICTIONARY.filter { it.startsWith(lower) && it !in results }
                          .take(3).forEach { results.add(it) }
                  } else {
                      KbConfig.AUTO_FIX_MAP[lower]?.let { results.add(it) }
                      val converted = lower
                          .replace("o'", "ö").replace("oʻ", "ö")
                          .replace("g'", "ğ").replace("gʻ", "ğ")
                          .replace("sh", "ş").replace("ch", "ç")
                      if (converted != lower && converted !in results) results.add(converted)
                      KbConfig.DICTIONARY_WORDS.filter { it.startsWith(lower) || it.startsWith(converted) }
                          .distinct().filter { it !in results }.take(3).forEach { results.add(it) }
                  }

                  if (lower !in results) results.add(lower)
                  return results.take(3).map { w ->
                      if (isCapitalized) w.replaceFirstChar { it.uppercase() } else w
                  }
              }

              private fun replaceCurrentWordWith(newWord: String, saveUndo: Boolean = false) {
                  val ic = currentInputConnection ?: return
                  val cur = getCurrentWordBeingTyped()
                  if (cur.isNotEmpty()) {
                      if (saveUndo && cur != newWord) {
                          lastAutoReplacedOriginal = cur
                          lastAutoReplacedTarget = newWord
                      }
                      ic.deleteSurroundingText(cur.length, 0)
                  }
                  ic.commitText("$newWord ", 1)
                  updateShiftStateFromEditor()
                  renderKeyboardUI()
              }

              private fun undoLastAutoReplace(original: String, target: String) {
                  val ic = currentInputConnection ?: return
                  val before = ic.getTextBeforeCursor(target.length + 2, 0)?.toString() ?: ""
                  if (before.endsWith("$target ")) {
                      ic.deleteSurroundingText(target.length + 1, 0)
                      ic.commitText("$original ", 1)
                  } else if (before.endsWith(target)) {
                      ic.deleteSurroundingText(target.length, 0)
                      ic.commitText(original, 1)
                  }
                  lastAutoReplacedOriginal = null
                  lastAutoReplacedTarget = null
                  renderKeyboardUI()
              }

              private fun buildLettersView(board: LinearLayout, theme: KbTheme) {
                  val layoutDef = getActiveLayout()
                  val showNumRow = prefs.getBoolean(KbConfig.KEY_NUM_ROW, true)
                  val fontScalePct = prefs.getInt(KbConfig.KEY_FONT_SCALE, 130)
                  val fontScale = fontScalePct / 100f
                  val heightScale = prefs.getInt(KbConfig.KEY_KEY_HEIGHT, 115) / 100f
                  val keyHeightDp = (46 * heightScale).toInt().coerceIn(42, 68)

                  if (showNumRow) {
                      val numRow = createRowLayout(dp(38))
                      listOf("1", "2", "3", "4", "5", "6", "7", "8", "9", "0").forEach { n ->
                          numRow.addView(createTouchDotCharKey(n, null, theme, 1f, 15.5f * fontScale))
                      }
                      board.addView(numRow)
                  }

                  val row1 = createRowLayout(dp(keyHeightDp))
                  val r1Keys = layoutDef.rows[0]
                  val baseSp1 = if (r1Keys.size > 10) 15.5f else 17.5f
                  r1Keys.forEach { k ->
                      val hint = KbConfig.POPUP_ALTS[k]?.firstOrNull()
                      row1.addView(createTouchDotCharKey(k, hint, theme, 1f, baseSp1 * fontScale))
                  }
                  board.addView(row1)

                  val row2 = createRowLayout(dp(keyHeightDp))
                  val r2Keys = layoutDef.rows[1]
                  val baseSp2 = if (r2Keys.size > 10) 15.5f else 17.5f
                  r2Keys.forEach { k ->
                      val hint = KbConfig.POPUP_ALTS[k]?.firstOrNull()
                      row2.addView(createTouchDotCharKey(k, hint, theme, 1f, baseSp2 * fontScale))
                  }
                  board.addView(row2)

                  val row3 = createRowLayout(dp(keyHeightDp))
                  val shiftLabel = when {
                      isCapsLock -> "⇪"
                      isShifted -> "⬆️"
                      else -> "⇧"
                  }
                  val shiftBg = if (isShifted || isCapsLock) theme.accentBg else theme.specKeyBg
                  val shiftTxt = if (isShifted || isCapsLock) theme.accentText else theme.keyText
                  row3.addView(createActionKey(shiftLabel, shiftBg, shiftTxt, 1.35f) { handleShiftPress() })

                  val r3Keys = layoutDef.rows[2]
                  val baseSp3 = if (r3Keys.size > 9) 15f else 17.5f
                  r3Keys.forEach { k ->
                      val hint = KbConfig.POPUP_ALTS[k]?.firstOrNull()
                      row3.addView(createTouchDotCharKey(k, hint, theme, 1f, baseSp3 * fontScale))
                  }

                  row3.addView(createRepeatableBackspaceKey(theme, 1.35f))
                  board.addView(row3)
                  board.addView(buildBottomActionRow(theme, layoutDef.badge))
              }

              private fun createTouchDotCharKey(
                  rawKey: String,
                  subHint: String?,
                  theme: KbTheme,
                  weight: Float,
                  textSp: Float
              ): View {
                  val displayChar = if (isShifted || isCapsLock) rawKey.uppercase() else rawKey
                  val alts = KbConfig.POPUP_ALTS[rawKey]
                  val keyView = TouchDotKeyView(this, rawKey, displayChar, subHint, theme, textSp.coerceIn(14f, 34f))

                  keyView.layoutParams = LinearLayout.LayoutParams(0, ViewGroup.LayoutParams.MATCH_PARENT, weight).apply {
                      setMargins(dp(2), dp(2), dp(2), dp(2))
                  }

                  var longPressed = false
                  val longPressHandler = Handler(Looper.getMainLooper())
                  val longPressRunnable = Runnable {
                      if (!alts.isNullOrEmpty()) {
                          longPressed = true
                          vibrateKey()
                          val altChar = alts.first()
                          val outAlt = if (isShifted || isCapsLock) altChar.uppercase() else altChar
                          showKeyPreviewBubble(keyView, outAlt, false, theme)
                          commitCharacter(altChar)
                      }
                  }

                  keyView.setOnTouchListener { v, event ->
                      when (event.actionMasked) {
                          MotionEvent.ACTION_DOWN -> {
                              longPressed = false
                              keyView.isPressedDown = true
                              vibrateKey()
                              showKeyPreviewBubble(v, displayChar, !alts.isNullOrEmpty(), theme)
                              longPressHandler.postDelayed(longPressRunnable, 370)
                              true
                          }
                          MotionEvent.ACTION_UP -> {
                              longPressHandler.removeCallbacks(longPressRunnable)
                              keyView.isPressedDown = false
                              dismissKeyPreview()
                              if (!longPressed) {
                                  commitCharacter(rawKey)
                              }
                              true
                          }
                          MotionEvent.ACTION_CANCEL -> {
                              longPressHandler.removeCallbacks(longPressRunnable)
                              keyView.isPressedDown = false
                              dismissKeyPreview()
                              true
                          }
                          else -> false
                      }
                  }
                  return keyView
              }

