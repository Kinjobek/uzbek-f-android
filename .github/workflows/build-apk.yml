name: Build Uzbek-F Ultimate v4.3

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-android-apk:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Depodan kodları al
        uses: actions/checkout@v4

      - name: 2. Java JDK 17 kurulumu
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 3. Gradle 8.5 kurulumu
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: 4. Android SDK lisanslarını onayla
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: 5. Aragon v4.3 Projesini Oluştur ve Derle (APK + AAB)
        run: |
          rm -rf app
          mkdir -p app/src/main/java/com/alharitm/uzbekfkeyboard
          mkdir -p app/src/main/res/xml
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/mipmap-anydpi-v26

          # 1. Release Keystore imza anahtarı oluştur
          rm -f release-key.jks
          keytool -genkeypair -v \
            -keystore release-key.jks \
            -alias alharitm_key \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass Alharitm2026! \
            -keypass Alharitm2026! \
            -dname "CN=Sarvarbek Nazarov, OU=Alharitm, O=Alharitm, L=Tashkent, ST=Tashkent, C=UZ"

          # 2. settings.gradle
          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "UzbekFKeyboardAragon"
          include(":app")
          EOF

          # 3. Root build.gradle
          cat << 'EOF' > build.gradle
          plugins {
              id 'com.android.application' version '8.2.0' apply false
              id 'org.jetbrains.kotlin.android' version '1.9.20' apply false
          }
          EOF

          # 4. app/build.gradle
          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }

          android {
              namespace 'com.alharitm.uzbekfkeyboard'
              compileSdk 34

              defaultConfig {
                  applicationId "com.alharitm.uzbekfkeyboard"
                  minSdk 23
                  targetSdk 34
                  versionCode 8
                  versionName "4.3.0"
              }

              signingConfigs {
                  release {
                      storeFile file("../release-key.jks")
                      storePassword "Alharitm2026!"
                      keyAlias "alharitm_key"
                      keyPassword "Alharitm2026!"
                  }
              }

              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                      minifyEnabled false
                      shrinkResources false
                  }
                  debug {
                      signingConfig signingConfigs.release
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = '17'
              }
          }
          EOF

          # 5. Uygulama İkonu (Özbekistan Bayrağı + Kare içinde Ö Ğ Ş Ç)
          cat << 'EOF' > app/src/main/res/drawable/ic_launcher_background.xml
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path android:fillColor="#0099B5" android:pathData="M0,0h108v35h-108z"/>
              <path android:fillColor="#CE1126" android:pathData="M0,35h108v2.5h-108z"/>
              <path android:fillColor="#FFFFFF" android:pathData="M0,37.5h108v33h-108z"/>
              <path android:fillColor="#CE1126" android:pathData="M0,70.5h108v2.5h-108z"/>
              <path android:fillColor="#1EB53A" android:pathData="M0,73h108v35h-108z"/>
          </vector>
          EOF

          cat << 'EOF' > app/src/main/res/drawable/ic_launcher_foreground.xml
