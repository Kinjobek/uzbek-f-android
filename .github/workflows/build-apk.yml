name: Build Uzbek-F Android APK (Pro v2.1 - Crash Fixed)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-android-apk:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Repozitoriydan kodlarni olish
        uses: actions/checkout@v4

      - name: 2. Java JDK 17 o'rnatish
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 3. Gradle 8.5 o'rnatish
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: 4. Loyiha strukturasini avtomatik tayyorlash va APK yig'ish
        run: |
          mkdir -p app/src/main/java/com/alharitm/uzbekfkeyboard
          mkdir -p app/src/main/res/xml

          # UzbekFKeyboardService.kt (Pro v2.1 - Barcha crash xatoliklari tuzatilgan)
          cat << 'EOF' > app/src/main/java/com/alharitm/uzbekfkeyboard/UzbekFKeyboardService.kt
          package com.alharitm.uzbekfkeyboard

          import android.app.Activity
          import android.content.ClipboardManager
          import android.content.Context
          import android.content.Intent
          import android.content.SharedPreferences
          import android.graphics.Color
          import android.graphics.Typeface
          import android.graphics.drawable.GradientDrawable
          import android.inputmethodservice.InputMethodService
          import android.os.Bundle
          import android.provider.Settings
          import android.util.TypedValue
          import android.view.Gravity
          import android.view.HapticFeedbackConstants
          import android.view.KeyEvent
          import android.view.View
          import android.view.ViewGroup
          import android.view.inputmethod.EditorInfo
          import android.view.inputmethod.InputMethodManager
          import android.widget.Button
          import android.widget.EditText
          import android.widget.GridLayout
          import android.widget.HorizontalScrollView
          import android.widget.LinearLayout
          import android.widget.ScrollView
          import android.widget.SeekBar
          import android.widget.Switch
          import android.widget.TextView

          data class KbTheme(
              val id: String,
              val name: String,
              val boardBg: String,
              val keyBg: String,
              val specialKeyBg: String,
              val accentBg: String,
              val keyText: String,
              val subText: String
          )

          object KbConfig {
              const val PREFS_NAME = "uzbek_f_prefs"
              const val KEY_LAYOUT = "layout_id"
              const val KEY_THEME = "theme_id"
              const val KEY_NUM_ROW = "show_number_row"
              const val KEY_EMOJI_BTN = "show_emoji_key"
              const val KEY_LANG_BTN = "show_lang_key"
              const val KEY_COMMA_BTN = "show_comma_key"
              const val KEY_PERIOD_BTN = "show_period_key"
              const val KEY_FONT_SCALE = "font_scale" // 80..130 (%)

              val THEMES = listOf(
                  KbTheme("default_dark", "Default Dark", "#131314", "#2D2E30", "#3C4043", "#A8C7FA", "#E3E3E3", "#9AA0A6"),
                  KbTheme("default_light", "Default Light", "#ECEFF1", "#FFFFFF", "#CFD8DC", "#0B57D0", "#1F1F1F", "#5F6368"),
                  KbTheme("obsidian_oled", "Obsidian OLED", "#000000", "#1A1C1E", "#282A2D", "#38BDF8", "#F8FAFC", "#94A3B8"),
                  KbTheme("slate_blue", "Slate Blue", "#0F172A", "#1E293B", "#334155", "#60A5FA", "#F8FAFC", "#94A3B8"),
                  KbTheme("crimson_red", "Crimson Red", "#3B0A0A", "#5C1414", "#7F1D1D", "#FCA5A5", "#FFF5F5", "#FECACA"),
                  KbTheme("forest_green", "Forest Green", "#062E1E", "#0A4730", "#115E40", "#6EE7B7", "#ECFDF5", "#A7F3D0"),
                  KbTheme("deep_teal", "Deep Teal", "#042F2E", "#115E59", "#0F766E", "#5EEAD4", "#F0FDFA", "#99F6E4"),
                  KbTheme("royal_blue", "Royal Blue", "#0B2447", "#19376D", "#264E86", "#93C5FD", "#EFF6FF", "#BFDBFE"),
                  KbTheme("sky_cyan", "Sky Cyan", "#CFFAFE", "#FFFFFF", "#A5F3FC", "#0891B2", "#083344", "#155E75")
              )

              val LAYOUT_NAMES = linkedMapOf(
                  "f_v1_0" to "Oʻzbek F v1.0 (Standart 10x3)",
                  "f_v1_1" to "Oʻzbek F v1.1 (Y oʻrta qatorda, Ö tepada)",
                  "f_v1_2" to "Oʻzbek F v1.2 (Ç va Ş oʻrni almashgan)",
                  "turkish_f" to "Türkçe F (12x3 Klassik)",
                  "uz_qwerty_new" to "Yangi Oʻzbek QWERTY (Ö, Ğ, Ş, Ç, ʼ bilan)"
              )

              fun getLayoutRows(layoutId: String): List<List<String>> {
                  return when (layoutId) {
                      "f_v1_1" -> listOf(
                          listOf("f", "g", "ğ", "o", "ö", "d", "r", "n", "h", "p"),
                          listOf("u", "i", "e", "a", "y", "t", "k", "l", "m", "s"),
                          listOf("j", "x", "v", "ç", "z", "ş", "b", "q", "ʼ")
                      )
                      "f_v1_2" -> listOf(
                          listOf("f", "g", "ğ", "o", "q", "d", "r", "n", "h", "p"),
                          listOf("u", "i", "e", "a", "ö", "t", "k", "l", "m", "s"),
                          listOf("j", "x", "v", "ş", "z", "ç", "b", "y", "ʼ")
                      )
                      "turkish_f" -> listOf(
                          listOf("f", "g", "ğ", "ı", "o", "d", "r", "n", "h", "p", "q", "w"),
                          listOf("u", "i", "e", "a", "ü", "t", "k", "m", "l", "y", "ş"),
                          listOf("j", "ö", "v", "c", "ç", "z", "s", "b", "x")
                      )
                      "uz_qwerty_new" -> listOf(
                          listOf("q", "w", "e", "r", "t", "y", "u", "i", "o", "p", "ö", "ğ"),
                          listOf("a", "s", "d", "f", "g", "h", "j", "k", "l", "ş", "ç"),
                          listOf("z", "x", "c", "v", "b", "n", "m", "ʼ")
                      )
                      else -> listOf( // f_v1_0
                          listOf("f", "g", "ğ", "o", "q", "d", "r", "n", "h", "p"),
                          listOf("u", "i", "e", "a", "ö", "t", "k", "l", "m", "s"),
                          listOf("j", "x", "v", "ç", "z", "ş", "b", "y", "ʼ")
                      )
                  }
              }

              fun safeColor(hex: String, fallback: Int = Color.BLACK): Int {
                  return try {
                      val clean = if (hex.startsWith("#")) hex else "#$hex"
                      Color.parseColor(clean)
                  } catch (_: Exception) {
                      fallback
                  }
              }
          }

          class SetupActivity : Activity() {
              private lateinit var prefs: SharedPreferences
              private lateinit var contentBox: LinearLayout

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  prefs = getSharedPreferences(KbConfig.PREFS_NAME, Context.MODE_PRIVATE)

                  val scroll = ScrollView(this).apply {
                      setBackgroundColor(KbConfig.safeColor("#F4F6FA"))
                  }
                  contentBox = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      val p = dp(16)
                      setPadding(p, p, p, p * 2)
                  }
                  scroll.addView(contentBox)
                  renderSettingsUI()
                  setContentView(scroll)
              }

              private fun renderSettingsUI() {
                  contentBox.removeAllViews()

                  // Header Card
                  val headerCard = createCard("#0F172A").apply {
                      val title = TextView(this@SetupActivity).apply {
                          text = "OʻZBEK F-KLAVIATURASI PRO (v2.1)"
                          setTextSize(TypedValue.COMPLEX_UNIT_SP, 18f)
                          typeface = Typeface.DEFAULT_BOLD
                          setTextColor(KbConfig.safeColor("#38BDF8"))
                      }
                      val sub = TextView(this@SetupActivity).apply {
                          text = "Alharitm.com • Gboard uslubidagi koʻp maketli va mavzuli tizim klaviaturasi"
                          setTextSize(TypedValue.COMPLEX_UNIT_SP, 12f)
                          setTextColor(KbConfig.safeColor("#CBD5E1"))
                          setPadding(0, dp(4), 0, dp(12))
                      }

                      val step1 = Button(this@SetupActivity).apply {
                          text = "1-QADAM: Tizim sozlamalaridan yoqish ⚙️"
                          isAllCaps = false
                          setTextColor(Color.WHITE)
                          background = roundRect("#0284C7", dp(12))
                          setOnClickListener { startActivity(Intent(Settings.ACTION_INPUT_METHOD_SETTINGS)) }
                      }
                      val step2 = Button(this@SetupActivity).apply {
                          text = "2-QADAM: Klaviaturani tanlash ⌨️"
                          isAllCaps = false
                          setTextColor(Color.WHITE)
                          background = roundRect("#059669", dp(12))
                          val lp = LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT)
                          lp.topMargin = dp(8)
                          layoutParams = lp
                          setOnClickListener {
                              val imm = getSystemService(INPUT_METHOD_SERVICE) as InputMethodManager
                              imm.showInputMethodPicker()
                          }
                      }

                      val testInput = EditText(this@SetupActivity).apply {
                          hint = "✍️ Klaviaturani shu yerda yozib sinab koʻring..."
                          setHintTextColor(KbConfig.safeColor("#94A3B8"))
                          setTextColor(Color.WHITE)
                          setTextSize(TypedValue.COMPLEX_UNIT_SP, 14f)
                          background = roundRect("#1E293B", dp(10))
                          val pad = dp(12)
                          setPadding(pad, pad, pad, pad)
                          val lp = LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT)
                          lp.topMargin = dp(10)
                          layoutParams = lp
                      }

                      addView(title)
                      addView(sub)
                      addView(step1)
                      addView(step2)
                      addView(testInput)
                  }
                  contentBox.addView(headerCard)

                  // Section 1: Keyboard Layout Selector
                  contentBox.addView(sectionHeader("Klaviatura Joylashuvi (Layouts)"))
                  val layoutCard = createCard("#FFFFFF")
                  val activeLayout = prefs.getString(KbConfig.KEY_LAYOUT, "f_v1_0") ?: "f_v1_0"

                  for ((id, label) in KbConfig.LAYOUT_NAMES) {
                      val isSelected = (id == activeLayout)
                      val btn = Button(this).apply {
                          text = (if (isSelected) "✅  " else "⚪  ") + label
                          isAllCaps = false
                          gravity = Gravity.START or Gravity.CENTER_VERTICAL
                          setPadding(dp(14), dp(10), dp(14), dp(10))
                          setTextSize(TypedValue.COMPLEX_UNIT_SP, 13f)
                          setTextColor(KbConfig.safeColor(if (isSelected) "#0B57D0" else "#1E293B"))
                          background = roundRect(if (isSelected) "#E8F0FE" else "#F8FAFC", dp(12))
                          val lp = LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT)
                          lp.bottomMargin = dp(8)
                          layoutParams = lp
                          setOnClickListener {
                              prefs.edit().putString(KbConfig.KEY_LAYOUT, id).apply()
                              renderSettingsUI()
                          }
                      }
                      layoutCard.addView(btn)
                  }
                  contentBox.addView(layoutCard)

                  // Section 2: Preferences (Gboard Keys & Switches)
                  contentBox.addView(sectionHeader("Tugmalar va Sozlamalar (Preferences)"))
                  val prefCard = createCard("#FFFFFF")

                  prefCard.addView(createSwitchRow(
                      "Raqamlar qatori (Number row)",
                      "Harflar tepasida 1–0 raqamlar qatorini doim koʻrsatish",
                      prefs.getBoolean(KbConfig.KEY_NUM_ROW, true)
                  ) { prefs.edit().putBoolean(KbConfig.KEY_NUM_ROW, it).apply() })

                  prefCard.addView(createSwitchRow(
                      "Emoji tugmasi (Emoji key)",
                      "Pastki qatorda maxsus 😊 Emoji tugmasini koʻrsatish",
                      prefs.getBoolean(KbConfig.KEY_EMOJI_BTN, true)
                  ) { prefs.edit().putBoolean(KbConfig.KEY_EMOJI_BTN, it).apply() })

                  prefCard.addView(createSwitchRow(
                      "Til almashtirish (Language switch key)",
                      "Pastki qatorda 🌐 Globus tugmasini koʻrsatish",
                      prefs.getBoolean(KbConfig.KEY_LANG_BTN, false)
                  ) { prefs.edit().putBoolean(KbConfig.KEY_LANG_BTN, it).apply() })

                  prefCard.addView(createSwitchRow(
                      "Vergul tugmasi (Comma key)",
                      "Chap tomonda vergul (,) tugmasini koʻrsatish",
                      prefs.getBoolean(KbConfig.KEY_COMMA_BTN, true)
                  ) { prefs.edit().putBoolean(KbConfig.KEY_COMMA_BTN, it).apply() })

                  prefCard.addView(createSwitchRow(
                      "Nuqta tugmasi (Period key)",
                      "Oʻng tomonda nuqta (.) tugmasini koʻrsatish",
                      prefs.getBoolean(KbConfig.KEY_PERIOD_BTN, true)
                  ) { prefs.edit().putBoolean(KbConfig.KEY_PERIOD_BTN, it).apply() })

                  // Font Size Slider
                  val scaleVal = prefs.getInt(KbConfig.KEY_FONT_SCALE, 100)
                  val fontLabel = TextView(this).apply {
                      text = "Shrift oʻlchami (Font size): $scaleVal%"
                      setTextSize(TypedValue.COMPLEX_UNIT_SP, 14f)
                      typeface = Typeface.DEFAULT_BOLD
                      setTextColor(KbConfig.safeColor("#0F172A"))
                      setPadding(0, dp(10), 0, dp(6))
                  }
                  val seek = SeekBar(this).apply {
                      max = 50
                      progress = (scaleVal - 80).coerceIn(0, 50)
                      setOnSeekBarChangeListener(object : SeekBar.OnSeekBarChangeListener {
                          override fun onProgressChanged(sb: SeekBar?, p: Int, fromUser: Boolean) {
                              val newScale = 80 + p
                              fontLabel.text = "Shrift oʻlchami (Font size): $newScale%"
                              prefs.edit().putInt(KbConfig.KEY_FONT_SCALE, newScale).apply()
                          }
                          override fun onStartTrackingTouch(sb: SeekBar?) {}
                          override fun onStopTrackingTouch(sb: SeekBar?) {}
                      })
                  }
                  prefCard.addView(fontLabel)
                  prefCard.addView(seek)
                  contentBox.addView(prefCard)

                  // Section 3: Theme Grid
                  contentBox.addView(sectionHeader("Mavzular va Ranglar (Themes)"))
                  val themeCard = createCard("#FFFFFF")
                  val activeTheme = prefs.getString(KbConfig.KEY_THEME, "default_dark") ?: "default_dark"

                  val grid = GridLayout(this).apply {
                      columnCount = 3
                  }

                  val screenW = resources.displayMetrics.widthPixels.coerceAtLeast(320)
                  val cardW = ((screenW - dp(88)) / 3).coerceAtLeast(dp(76))

                  for (theme in KbConfig.THEMES) {
                      val isSelected = (theme.id == activeTheme)
                      val itemBox = LinearLayout(this).apply {
                          orientation = LinearLayout.VERTICAL
                          gravity = Gravity.CENTER
                          val p = dp(6)
                          setPadding(p, p, p, p)
                          layoutParams = GridLayout.LayoutParams().apply {
                              width = cardW
                              height = dp(82)
                              setMargins(dp(4), dp(4), dp(4), dp(4))
                          }
                          background = GradientDrawable().apply {
                              cornerRadius = dp(14).toFloat()
                              setColor(KbConfig.safeColor(theme.boardBg))
                              setStroke(dp(if (isSelected) 3 else 1), KbConfig.safeColor(if (isSelected) "#0B57D0" else "#CBD5E1"))
                          }
                          setOnClickListener {
                              prefs.edit().putString(KbConfig.KEY_THEME, theme.id).apply()
                              renderSettingsUI()
                          }
                      }

                      val checkTxt = TextView(this).apply {
                          text = if (isSelected) "✓ ${theme.name}" else theme.name
                          setTextSize(TypedValue.COMPLEX_UNIT_SP, 11f)
                          typeface = Typeface.DEFAULT_BOLD
                          gravity = Gravity.CENTER
                          setTextColor(KbConfig.safeColor(theme.keyText))
                      }

                      val miniBar = LinearLayout(this).apply {
                          orientation = LinearLayout.HORIZONTAL
                          gravity = Gravity.CENTER_VERTICAL
                          setPadding(0, dp(8), 0, 0)
                      }
                      val spaceMock = View(this).apply {
                          background = roundRect(theme.keyBg, dp(4))
                          layoutParams = LinearLayout.LayoutParams(dp(40), dp(9)).apply { rightMargin = dp(5) }
                      }
                      val enterMock = View(this).apply {
                          background = roundRect(theme.accentBg, dp(5))
                          layoutParams = LinearLayout.LayoutParams(dp(14), dp(9))
                      }
                      miniBar.addView(spaceMock)
                      miniBar.addView(enterMock)

                      itemBox.addView(checkTxt)
                      itemBox.addView(miniBar)
                      grid.addView(itemBox)
                  }
                  themeCard.addView(grid)
                  contentBox.addView(themeCard)
              }

              private fun sectionHeader(title: String): TextView {
                  return TextView(this).apply {
                      text = title
                      setTextSize(TypedValue.COMPLEX_UNIT_SP, 14f)
                      typeface = Typeface.DEFAULT_BOLD
                      setTextColor(KbConfig.safeColor("#3B5998"))
                      setPadding(dp(4), dp(16), dp(4), dp(8))
                  }
              }

              private fun createCard(bgHex: String): LinearLayout {
                  return LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      val p = dp(14)
                      setPadding(p, p, p, p)
                      background = roundRect(bgHex, dp(16))
                  }
              }

              private fun createSwitchRow(title: String, subtitle: String, checked: Boolean, onToggle: (Boolean) -> Unit): View {
                  val row = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      gravity = Gravity.CENTER_VERTICAL
                      setPadding(0, dp(8), 0, dp(8))
                  }
                  val textCol = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      layoutParams = LinearLayout.LayoutParams(0, ViewGroup.LayoutParams.WRAP_CONTENT, 1f)
                  }
                  val tView = TextView(this).apply {
                      text = title
                      setTextSize(TypedValue.COMPLEX_UNIT_SP, 14f)
                      typeface = Typeface.DEFAULT_BOLD
                      setTextColor(KbConfig.safeColor("#0F172A"))
                  }
                  val sView = TextView(this).apply {
                      text = subtitle
                      setTextSize(TypedValue.COMPLEX_UNIT_SP, 11f)
                      setTextColor(KbConfig.safeColor("#64748B"))
                  }
                  textCol.addView(tView)
                  textCol.addView(sView)

                  val sw = Switch(this).apply {
                      isChecked = checked
                      setOnCheckedChangeListener { _, isChecked -> onToggle(isChecked) }
                  }
                  row.addView(textCol)
                  row.addView(sw)
                  return row
              }

              private fun roundRect(hex: String, radiusPx: Int): GradientDrawable {
                  return GradientDrawable().apply {
                      cornerRadius = radiusPx.toFloat()
                      setColor(KbConfig.safeColor(hex))
                  }
              }

              private fun dp(v: Int): Int = (v * resources.displayMetrics.density).toInt()
          }

          class UzbekFKeyboardService : InputMethodService() {

              private enum class ViewMode {
                  LETTERS, SYM1, SYM2, NUMPAD, EMOJI, QUICK_MENU, THEME_PICKER, LAYOUT_PICKER
              }

              private var currentMode = ViewMode.LETTERS
              private var shiftState = 0 // 0=off, 1=shift, 2=capslock
              private var oneHandedMode = 0 // 0=normal, 1=left, 2=right
              private var lastSpaceTime = 0L
              private var lastShiftTime = 0L
              private var rootContainer: LinearLayout? = null
              private lateinit var prefs: SharedPreferences

              private val longPressMap = mapOf(
                  "f" to "1", "g" to "2", "ğ" to "3", "o" to "4", "q" to "5",
                  "d" to "6", "r" to "7", "n" to "8", "h" to "9", "p" to "0",
                  "ç" to "c", "v" to "w", "ʼ" to "\"", "a" to "@", "s" to "$", "e" to "€"
              )

              private val sym1Rows = listOf(
                  listOf("1", "2", "3", "4", "5", "6", "7", "8", "9", "0"),
                  listOf("@", "#", "₺", "_", "&", "-", "+", "(", ")", "/"),
                  listOf("=\\<", "*", "\"", "'", ":", ";", "!", "?", "DEL")
              )

              private val sym2Rows = listOf(
                  listOf("~", "`", "|", "•", "√", "π", "÷", "×", "§", "Δ"),
                  listOf("£", "€", "$", "¢", "^", "°", "=", "{", "}", "\\"),
                  listOf("?123", "%", "©", "®", "™", "✓", "[", "]", "DEL")
              )

              private val emojiList = listOf(
                  "😀","😃","😄","😁","😆","😅","😂","🤣","😭","😉","😗","😙","😚","😘","🥰","😍","🤩","🥳",
                  "🫠","🙃","🙂","🥲","🥹","😊","☺️","😌","😏","😴","😪","🤤","😋","😛","😝","😜","🤪","🥴",
                  "😔","🥺","😬","😑","😐","😶","🫡","🤔","🤫","🤭","🥱","🤗","😱","🤨","🧐","😒","🙄","😮‍💨",
                  "😤","😠","😡","🤬","😞","😓","😟","😥","😢","☹️","🙁","🫤","😕","😰","😨","😧","😦","😮",
                  "🔥","❤️","💙","💚","💛","💜","🖤","🤍","💯","✨","🌟","🎉","👍","👎","👏","🙌","🤝","🙏",
                  "🇺🇿","🇹🇷","🚀","💻","📱","⌨️","📚","🎓","🏆","⚡","💡","🎵","☕","🍀","🌙","☀️","⭐","💎"
              )

              override fun onCreate() {
                  super.onCreate()
                  prefs = getSharedPreferences(KbConfig.PREFS_NAME, Context.MODE_PRIVATE)
              }

              override fun onCreateInputView(): View {
                  val container = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      layoutParams = ViewGroup.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT,
                          ViewGroup.LayoutParams.WRAP_CONTENT
                      )
                  }
                  rootContainer = container
                  renderKeyboard()
                  return container
              }

              override fun onStartInputView(info: EditorInfo?, restarting: Boolean) {
                  super.onStartInputView(info, restarting)
                  currentMode = ViewMode.LETTERS
                  if (rootContainer != null) {
                      renderKeyboard()
                  }
              }

              private fun getActiveTheme(): KbTheme {
                  if (!::prefs.isInitialized) {
                      prefs = getSharedPreferences(KbConfig.PREFS_NAME, Context.MODE_PRIVATE)
                  }
                  val id = prefs.getString(KbConfig.KEY_THEME, "default_dark") ?: "default_dark"
                  return KbConfig.THEMES.find { it.id == id } ?: KbConfig.THEMES.first()
              }

              private fun getActiveLayoutId(): String {
                  if (!::prefs.isInitialized) {
                      prefs = getSharedPreferences(KbConfig.PREFS_NAME, Context.MODE_PRIVATE)
                  }
                  return prefs.getString(KbConfig.KEY_LAYOUT, "f_v1_0") ?: "f_v1_0"
              }

              private fun renderKeyboard() {
                  val container = rootContainer ?: return
                  container.removeAllViews()
                  val theme = getActiveTheme()
                  container.setBackgroundColor(KbConfig.safeColor(theme.boardBg))

                  val padH = if (oneHandedMode == 0) dp(4) else dp(42)
                  container.setPadding(
                      if (oneHandedMode == 2) padH else dp(4),
                      dp(4),
                      if (oneHandedMode == 1) padH else dp(4),
                      dp(10)
                  )

                  // 1. Gboard Top Toolbar Strip
                  container.addView(buildTopToolbar(theme))

                  // 2. Main Body View
                  when (currentMode) {
                      ViewMode.LETTERS -> buildLettersView(container, theme)
                      ViewMode.SYM1 -> buildSymbolsView(container, theme, isSecondary = false)
                      ViewMode.SYM2 -> buildSymbolsView(container, theme, isSecondary = true)
                      ViewMode.NUMPAD -> buildNumpadView(container, theme)
                      ViewMode.EMOJI -> buildEmojiView(container, theme)
                      ViewMode.QUICK_MENU -> buildQuickMenuView(container, theme)
                      ViewMode.THEME_PICKER -> buildThemePickerView(container, theme)
                      ViewMode.LAYOUT_PICKER -> buildLayoutPickerView(container, theme)
                  }
              }

              private fun buildTopToolbar(theme: KbTheme): View {
                  val bar = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      gravity = Gravity.CENTER_VERTICAL
                      weightSum = 6f
                      layoutParams = LinearLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT,
                          dp(40)
                      ).apply { bottomMargin = dp(4) }
                  }

                  fun toolBtn(icon: String, active: Boolean = false, onClick: () -> Unit): View {
                      return Button(this).apply {
                          text = icon
                          isAllCaps = false
                          setTextSize(TypedValue.COMPLEX_UNIT_SP, 15f)
                          setTextColor(KbConfig.safeColor(if (active) theme.boardBg else theme.keyText))
                          setPadding(0, 0, 0, 0)
                          background = GradientDrawable().apply {
                              cornerRadius = dp(18).toFloat()
                              setColor(if (active) KbConfig.safeColor(theme.accentBg) else Color.TRANSPARENT)
                          }
                          layoutParams = LinearLayout.LayoutParams(0, dp(34), 1f).apply {
                              setMargins(dp(3), 0, dp(3), 0)
                          }
                          setOnClickListener {
                              it.performHapticFeedback(HapticFeedbackConstants.KEYBOARD_TAP)
                              onClick()
                          }
                      }
                  }

                  val isMenuOpen = (currentMode == ViewMode.QUICK_MENU)
                  bar.addView(toolBtn(if (isMenuOpen) "✕" else "⊞", isMenuOpen) {
                      currentMode = if (isMenuOpen) ViewMode.LETTERS else ViewMode.QUICK_MENU
                      renderKeyboard()
                  })
                  bar.addView(toolBtn("😊", currentMode == ViewMode.EMOJI) {
                      currentMode = if (currentMode == ViewMode.EMOJI) ViewMode.LETTERS else ViewMode.EMOJI
                      renderKeyboard()
                  })
                  bar.addView(toolBtn("📋") { pasteFromClipboard() })
                  bar.addView(toolBtn("🎨", currentMode == ViewMode.THEME_PICKER) {
                      currentMode = if (currentMode == ViewMode.THEME_PICKER) ViewMode.LETTERS else ViewMode.THEME_PICKER
                      renderKeyboard()
                  })
                  bar.addView(toolBtn("⌨️", currentMode == ViewMode.LAYOUT_PICKER) {
                      currentMode = if (currentMode == ViewMode.LAYOUT_PICKER) ViewMode.LETTERS else ViewMode.LAYOUT_PICKER
                      renderKeyboard()
                  })
                  bar.addView(toolBtn("⚙️") {
                      try {
                          val intent = Intent(this, SetupActivity::class.java).apply {
                              addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                          }
                          startActivity(intent)
                      } catch (_: Exception) {}
                  })

                  return bar
              }

              private fun buildLettersView(container: LinearLayout, theme: KbTheme) {
                  val layoutId = getActiveLayoutId()
                  val showNumRow = prefs.getBoolean(KbConfig.KEY_NUM_ROW, true)

                  if (showNumRow) {
                      val numRow = LinearLayout(this).apply {
                          orientation = LinearLayout.HORIZONTAL
                          weightSum = 10f
                          layoutParams = LinearLayout.LayoutParams(
                              ViewGroup.LayoutParams.MATCH_PARENT,
                              dp(40)
                          ).apply { bottomMargin = dp(5) }
                      }
                      for (n in listOf("1","2","3","4","5","6","7","8","9","0")) {
                          val btn = createKey(n, 1f, theme, isSpecial = false, heightDp = 40)
                          btn.setOnClickListener {
                              it.performHapticFeedback(HapticFeedbackConstants.KEYBOARD_TAP)
                              commit(n)
                          }
                          numRow.addView(btn)
                      }
                      container.addView(numRow)
                  }

                  val rows = KbConfig.getLayoutRows(layoutId)

                  for (rIdx in 0..1) {
                      val rKeys = rows[rIdx]
                      val rowLayout = LinearLayout(this).apply {
                          orientation = LinearLayout.HORIZONTAL
                          weightSum = rKeys.size.toFloat()
                          layoutParams = LinearLayout.LayoutParams(
                              ViewGroup.LayoutParams.MATCH_PARENT,
                              dp(48)
                          ).apply { bottomMargin = dp(5) }
                      }
                      for (k in rKeys) {
                          val outChar = formatCase(k)
                          val btn = createKey(outChar, 1f, theme, isSpecial = false)
                          btn.setOnClickListener {
                              it.performHapticFeedback(HapticFeedbackConstants.KEYBOARD_TAP)
                              commit(outChar)
                              if (shiftState == 1) {
                                  shiftState = 0
                                  renderKeyboard()
                              }
                          }
                          val alt = longPressMap[k]
                          if (alt != null) {
                              btn.setOnLongClickListener {
                                  it.performHapticFeedback(HapticFeedbackConstants.LONG_PRESS)
                                  commit(formatCase(alt))
                                  true
                              }
                          }
                          rowLayout.addView(btn)
                      }
                      container.addView(rowLayout)
                  }

                  val r3Keys = rows[2]
                  val row3Layout = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      weightSum = (r3Keys.size + 2.6f)
                      layoutParams = LinearLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT,
                          dp(48)
                      ).apply { bottomMargin = dp(5) }
                  }

                  val shiftLabel = when (shiftState) {
                      2 -> "⇪"
                      1 -> "⬆"
                      else -> "⇧"
                  }
                  val shiftBtn = createKey(shiftLabel, 1.3f, theme, isSpecial = true, isAccent = (shiftState > 0))
                  shiftBtn.setOnClickListener {
                      it.performHapticFeedback(HapticFeedbackConstants.KEYBOARD_TAP)
                      val now = System.currentTimeMillis()
                      shiftState = if (now - lastShiftTime < 320L) {
                          2
                      } else if (shiftState == 2 || shiftState == 1) {
                          0
                      } else {
                          1
                      }
                      lastShiftTime = now
                      renderKeyboard()
                  }
                  row3Layout.addView(shiftBtn)

                  for (k in r3Keys) {
                      val outChar = formatCase(k)
                      val btn = createKey(outChar, 1f, theme, isSpecial = false)
                      btn.setOnClickListener {
                          it.performHapticFeedback(HapticFeedbackConstants.KEYBOARD_TAP)
                          commit(outChar)
                          if (shiftState == 1) {
                              shiftState = 0
                              renderKeyboard()
                          }
                      }
                      val alt = longPressMap[k]
                      if (alt != null) {
                          btn.setOnLongClickListener {
                              it.performHapticFeedback(HapticFeedbackConstants.LONG_PRESS)
                              commit(formatCase(alt))
                              true
                          }
                      }
                      row3Layout.addView(btn)
                  }

                  val delBtn = createKey("⌫", 1.3f, theme, isSpecial = true)
                  delBtn.setOnClickListener {
                      it.performHapticFeedback(HapticFeedbackConstants.KEYBOARD_TAP)
                      deleteChar()
                  }
                  delBtn.setOnLongClickListener {
                      it.performHapticFeedback(HapticFeedbackConstants.LONG_PRESS)
                      currentInputConnection?.deleteSurroundingText(12, 0)
                      true
                  }
                  row3Layout.addView(delBtn)
                  container.addView(row3Layout)

                  container.addView(buildBottomActionRow(theme))
              }

              private fun buildSymbolsView(container: LinearLayout, theme: KbTheme, isSecondary: Boolean) {
                  val rows = if (isSecondary) sym2Rows else sym1Rows

                  for (rIdx in 0..2) {
                      val rKeys = rows[rIdx]
                      val rowLayout = LinearLayout(this).apply {
                          orientation = LinearLayout.HORIZONTAL
                          weightSum = if (rIdx == 2) 10f else rKeys.size.toFloat()
                          layoutParams = LinearLayout.LayoutParams(
                              ViewGroup.LayoutParams.MATCH_PARENT,
                              dp(48)
                          ).apply { bottomMargin = dp(5) }
                      }

                      for (k in rKeys) {
                          val weight = if (rIdx == 2 && (k == "=\\<" || k == "?123" || k == "DEL")) 1.5f else 1f
                          val isSpec = (k == "=\\<" || k == "?123" || k == "DEL")
                          val label = if (k == "DEL") "⌫" else k
                          val btn = createKey(label, weight, theme, isSpecial = isSpec)
                          btn.setOnClickListener {
                              it.performHapticFeedback(HapticFeedbackConstants.KEYBOARD_TAP)
                              when (k) {
                                  "=\\<" -> { currentMode = ViewMode.SYM2; renderKeyboard() }
                                  "?123" -> { currentMode = ViewMode.SYM1; renderKeyboard() }
                                  "DEL" -> deleteChar()
                                  else -> commit(k)
                              }
                          }
                          rowLayout.addView(btn)
                      }
                      container.addView(rowLayout)
                  }

                  val botRow = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      weightSum = 10f
                      layoutParams = LinearLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT,
                          dp(48)
                      )
                  }

                  botRow.addView(createKey("ABC", 1.5f, theme, isSpecial = true).apply {
                      setOnClickListener { currentMode = ViewMode.LETTERS; renderKeyboard() }
                  })
                  botRow.addView(createKey(if (isSecondary) "<" else ",", 1f, theme, isSpecial = true).apply {
                      setOnClickListener { commit(if (isSecondary) "<" else ",") }
                  })
                  botRow.addView(createKey("1234", 1.2f, theme, isSpecial = true).apply {
                      setOnClickListener { currentMode = ViewMode.NUMPAD; renderKeyboard() }
                  })
                  botRow.addView(createKey(getShortLayoutLabel(), 3.8f, theme, isSpecial = false).apply {
                      setOnClickListener { commit(" ") }
                  })
                  botRow.addView(createKey(if (isSecondary) ">" else ".", 1f, theme, isSpecial = true).apply {
                      setOnClickListener { commit(if (isSecondary) ">" else ".") }
                  })
                  botRow.addView(createKey("↵", 1.5f, theme, isSpecial = true, isAccent = true).apply {
                      setOnClickListener { sendEnter() }
                  })
                  container.addView(botRow)
              }

              private fun buildNumpadView(container: LinearLayout, theme: KbTheme) {
                  val numRows = listOf(
                      listOf("+", "1", "2", "3", "%"),
                      listOf("-", "4", "5", "6", "␣"),
                      listOf("*", "7", "8", "9", "⌫")
                  )
                  for (r in numRows) {
                      val rowLayout = LinearLayout(this).apply {
                          orientation = LinearLayout.HORIZONTAL
                          weightSum = 6f
                          layoutParams = LinearLayout.LayoutParams(
                              ViewGroup.LayoutParams.MATCH_PARENT,
                              dp(52)
                          ).apply { bottomMargin = dp(5) }
                      }
                      r.forEachIndexed { idx, k ->
                          val w = if (idx in 1..3) 1.33f else 1f
                          val isSpec = (idx == 0 || idx == 4)
                          val btn = createKey(k, w, theme, isSpecial = isSpec, heightDp = 52)
                          btn.setOnClickListener {
                              it.performHapticFeedback(HapticFeedbackConstants.KEYBOARD_TAP)
                              when (k) {
                                  "␣" -> commit(" ")
                                  "⌫" -> deleteChar()
                                  else -> commit(k)
                              }
                          }
                          rowLayout.addView(btn)
                      }
                      container.addView(rowLayout)
                  }

                  val bot = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      weightSum = 6f
                      layoutParams = LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, dp(50))
                  }
                  bot.addView(createKey("ABC", 1f, theme, isSpecial = true).apply {
                      setOnClickListener { currentMode = ViewMode.LETTERS; renderKeyboard() }
                  })
                  bot.addView(createKey("/", 0.8f, theme, isSpecial = true).apply {
                      setOnClickListener { commit("/") }
                  })
                  bot.addView(createKey("!?#", 0.9f, theme, isSpecial = true).apply {
                      setOnClickListener { currentMode = ViewMode.SYM1; renderKeyboard() }
                  })
                  bot.addView(createKey("0", 1.5f, theme, isSpecial = false).apply {
                      setOnClickListener { commit("0") }
                  })
                  bot.addView(createKey("=", 0.8f, theme, isSpecial = true).apply {
                      setOnClickListener { commit("=") }
                  })
                  bot.addView(createKey("↵", 1f, theme, isSpecial = true, isAccent = true).apply {
                      setOnClickListener { sendEnter() }
                  })
                  container.addView(bot)
              }

