      - name: 5. Keystore imzo kaliti yaratish va Play Store Release APK + AAB yig'ish
        run: |
          # Google Play va Android telefonlar "virus/noma'lum" deb ogohlantirmasligi uchun rasmiy Release Keystore yaratamiz
          keytool -genkeypair -v \
            -keystore release-key.jks \
            -alias alharitm_key \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass Alharitm2026! \
            -keypass Alharitm2026! \
            -dname "CN=Alharitm.com, OU=Mobile, O=Alharitm, L=Tashkent, ST=Tashkent, C=UZ"

          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }
          android {
              namespace 'com.alharitm.uzbekfkeyboard'
              compileSdk 34
              defaultConfig {
                  applicationId "com.alharitm.uzbekfkeyboard"
                  minSdk 23
                  targetSdk 34
                  versionCode 4
                  versionName "3.0"
              }
              signingConfigs {
                  release {
                      storeFile file("../release-key.jks")
                      storePassword "Alharitm2026!"
                      keyAlias "alharitm_key"
                      keyPassword "Alharitm2026!"
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                      minifyEnabled false
                      shrinkResources false
                  }
                  debug {
                      signingConfig signingConfigs.release
                  }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions {
