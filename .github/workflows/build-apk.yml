              fun safeColor(hex: String, fallback: Int = Color.BLACK): Int {
                  return try {
                      val clean = if (hex.startsWith("#")) hex else "#$hex"
                      Color.parseColor(clean)
                  } catch (_: Exception) {
                      fallback
                  }
              }
