                  "kömak", "xizmat", "vazifa", "burch", "burç", "imkon", "imkoniyat", "fursat", "foyda",
                  "samarali", "tez", "oson", "qulay", "ravon", "aniq", "töliq", "mukammal", "namuna", "misol"
              )

              val DEFAULT_SUGGESTIONS = listOf("Assalomu alaykum", "Özbekiston", "yaxşi", "töğri", "maʼlumot", "taʼlim")

              // Eski lotin yozuvini (o', g', sh, ch) yangi alifboga (ö, ğ, ş, ç) o'girish
              fun convertToNewOrthography(raw: String): String {
                  var s = raw
                  s = s.replace("o'", "ö").replace("O'", "Ö")
                      .replace("oʻ", "ö").replace("Oʻ", "Ö")
                      .replace("g'", "ğ").replace("G'", "Ğ")
                      .replace("gʻ", "ğ").replace("Gʻ", "Ğ")
                      .replace("sh", "ş").replace("Sh", "Ş").replace("SH", "Ş")
                      .replace("ch", "ç").replace("Ch", "Ç").replace("CH", "Ç")
                  return s
              }

              // Diakritik belgilarsiz qidiruv uchun normalizatsiya
              private fun fold(s: String): String {
                  return s.lowercase()
                      .replace('ö', 'o')
                      .replace('ğ', 'g')
                      .replace('ş', 's')
                      .replace('ç', 'c')
                      .replace("ʼ", "")
                      .replace("'", "")
              }

              // Kiritilayotgan so'z uchun eng mos 3-4 ta to'g'ri variantni topish
              fun getSuggestions(currentWord: String, enabled: Boolean): List<String> {
                  if (!enabled) return emptyList()
                  val trimmed = currentWord.trim()
                  if (trimmed.isEmpty()) return DEFAULT_SUGGESTIONS.take(3)

                  val lower = trimmed.lowercase()
                  val isCapitalized = trimmed[0].isUpperCase()
                  val results = LinkedHashSet<String>()

                  fun applyCase(word: String): String {
                      if (word.isEmpty()) return word
                      return if (isCapitalized) word.replaceFirstChar { it.uppercase() } else word
                  }

                  // 1. To'g'ridan-to'g'ri xato lug'atidan tekshirish
                  DIRECT_FIXES[lower]?.let { results.add(applyCase(it)) }

                  // 2. Agar o', g', sh, ch yozilgan bo'lsa, yangi alifbodagi shaklini birinchi qilib chiqarish
                  val converted = convertToNewOrthography(trimmed)
                  if (converted != trimmed) {
                      results.add(converted)
                  }

                  // 3. Lug'atdan aynan boshlanishi (prefix) bo'yicha qidirish
                  val foldedInput = fold(lower)
                  for (w in WORDS) {
                      if (w.lowercase().startsWith(lower) || fold(w).startsWith(foldedInput)) {
                          results.add(applyCase(w))
                          if (results.size >= 4) break
                      }
                  }

                  // 4. Agar hali ham kam bo'lsa, Levenshtein (1-2 harf xato) bo'yicha yaqin so'zlarni topish
                  if (results.size < 3 && foldedInput.length >= 2) {
                      val closeMatches = WORDS
                          .map { w -> w to editDistance(foldedInput, fold(w)) }
                          .filter { it.second <= 2 }
                          .sortedBy { it.second }
                          .map { applyCase(it.first) }
                      for (m in closeMatches) {
                          results.add(m)
                          if (results.size >= 4) break
                      }
                  }

                  // Foydalanuvchi yozayotgan asl so'zni ham oxiriga qo'shamiz
                  if (results.isEmpty()) {
                      results.add(trimmed)
                  }
                  return results.take(4)
              }

              private fun editDistance(a: String, b: String): Int {
                  val dp = IntArray(b.length + 1) { it }
                  for (i in 1..a.length) {
                      var prev = dp[0]
                      dp[0] = i
                      for (j in 1..b.length) {
                          val temp = dp[j]
                          val cost = if (a[i - 1] == b[j - 1]) 0 else 1
                          dp[j] = minOf(dp[j] + 1, dp[j - 1] + 1, prev + cost)
                          prev = temp
                      }
                  }
                  return dp[b.length]
              }
          }

