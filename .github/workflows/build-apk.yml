              private fun createRepeatableBackspaceKey(theme: KbTheme, weight: Float): Button {
                  return Button(this).apply {
                      text = "⌫"
                      isAllCaps = false
                      setTextSize(TypedValue.COMPLEX_UNIT_SP, 18f)
                      setTextColor(KbConfig.safeColor(theme.keyText))
                      background = roundedBg(theme.specKeyBg, 8f)
                      setPadding(0, 0, 0, 0)
                      layoutParams = LinearLayout.LayoutParams(0, ViewGroup.LayoutParams.MATCH_PARENT, weight).apply {
                          setMargins(dp(2), dp(1), dp(2), dp(1))
                      }
                      setOnTouchListener { _, event ->
                          when (event.action) {
                              MotionEvent.ACTION_DOWN -> {
                                  vibrateKey()
                                  handleBackspace()
                                  isDeleting = true
                                  deleteHandler.postDelayed(deleteRunnable, 380)
                                  true
                              }
                              MotionEvent.ACTION_UP, MotionEvent.ACTION_CANCEL -> {
                                  isDeleting = false
                                  deleteHandler.removeCallbacks(deleteRunnable)
                                  true
                              }
                              else -> false
                          }
                      }
                  }
              }

              private fun commitCharacter(raw: String) {
                  val ic = currentInputConnection ?: return
                  val out = if (isShifted || isCapsLock) raw.uppercase() else raw
                  lastAutoReplacedOriginal = null
                  lastAutoReplacedTarget = null
                  ic.commitText(out, 1)

                  if (isShifted && !isCapsLock) {
                      isShifted = false
                  }
                  renderKeyboardUI()
              }

              private fun handleShiftPress() {
                  val now = System.currentTimeMillis()
                  if (now - lastShiftClickTime < 320) {
                      isCapsLock = true
                      isShifted = true
                  } else if (isCapsLock) {
                      isCapsLock = false
                      isShifted = false
                  } else {
                      isShifted = !isShifted
                  }
                  lastShiftClickTime = now
                  renderKeyboardUI()
              }

              private fun handleBackspace() {
                  val ic = currentInputConnection ?: return
                  val selected = ic.getSelectedText(0)
                  if (!selected.isNullOrEmpty()) {
                      ic.commitText("", 1)
                  } else {
                      ic.deleteSurroundingText(1, 0)
                  }
                  updateShiftStateFromEditor()
                  renderKeyboardUI()
              }

              private fun handleSpace() {
                  val ic = currentInputConnection ?: return
                  val autoCorrect = prefs.getBoolean(KbConfig.KEY_AUTO_CORRECT, true)

                  if (autoCorrect && !isPasswordInput && currentMode == ViewMode.LETTERS) {
                      val curWord = getCurrentWordBeingTyped()
                      if (curWord.length >= 2) {
                          val lower = curWord.lowercase()
                          val layout = getActiveLayout()
                          val fixed = if (layout.isCyrillic) KbConfig.CYRILLIC_AUTO_FIX[lower] else KbConfig.AUTO_FIX_MAP[lower]
                          if (fixed != null && fixed != lower) {
                              val outWord = if (curWord.first().isUpperCase()) fixed.replaceFirstChar { it.uppercase() } else fixed
                              lastAutoReplacedOriginal = curWord
                              lastAutoReplacedTarget = outWord
                              ic.deleteSurroundingText(curWord.length, 0)
                              ic.commitText("$outWord ", 1)
                              updateShiftStateFromEditor()
                              renderKeyboardUI()
                              return
                          }
                      }
                  }

                  val now = System.currentTimeMillis()
                  if (now - lastSpaceClickTime < 280 && !isPasswordInput) {
                      val before = ic.getTextBeforeCursor(2, 0) ?: ""
                      if (before.endsWith(" ") && before.length == 2 && before[0].isLetterOrDigit()) {
                          ic.deleteSurroundingText(1, 0)
                          ic.commitText(". ", 1)
                          lastSpaceClickTime = 0L
                          updateShiftStateFromEditor()
                          renderKeyboardUI()
                          return
                      }
                  }
                  lastSpaceClickTime = now
                  ic.commitText(" ", 1)
                  updateShiftStateFromEditor()
                  renderKeyboardUI()
              }

              private fun handleEnter() {
                  val ic = currentInputConnection ?: return
                  val info = currentInputEditorInfo
                  val action = info?.imeOptions?.and(EditorInfo.IME_MASK_ACTION) ?: EditorInfo.IME_ACTION_NONE
                  if (action != EditorInfo.IME_ACTION_NONE && action != EditorInfo.IME_ACTION_UNSPECIFIED) {
                      ic.performEditorAction(action)
                  } else {
                      ic.sendKeyEvent(KeyEvent(KeyEvent.ACTION_DOWN, KeyEvent.KEYCODE_ENTER))
                      ic.sendKeyEvent(KeyEvent(KeyEvent.ACTION_UP, KeyEvent.KEYCODE_ENTER))
                  }
              }

              private fun cycleNextLayout() {
                  val curId = getActiveLayout().id
                  val idx = KbConfig.LAYOUTS.indexOfFirst { it.id == curId }
                  val next = KbConfig.LAYOUTS[(idx + 1) % KbConfig.LAYOUTS.size]
                  prefs.edit().putString(KbConfig.KEY_LAYOUT, next.id).apply()
                  currentMode = ViewMode.LETTERS
                  Toast.makeText(this, "Maket: ${next.title}", Toast.LENGTH_SHORT).show()
                  renderKeyboardUI()
              }

              private fun pasteFromClipboard() {
                  val cm = getSystemService(Context.CLIPBOARD_SERVICE) as? ClipboardManager ?: return
                  val item = cm.primaryClip?.getItemAt(0)?.text?.toString()
                  if (!item.isNullOrEmpty()) {
                      currentInputConnection?.commitText(item, 1)
                  } else {
                      Toast.makeText(this, "Bufer boʻsh", Toast.LENGTH_SHORT).show()
                  }
              }

              private fun openSettingsApp() {
                  try {
                      val intent = Intent(this, SetupActivity::class.java).apply {
                          addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                      }
                      startActivity(intent)
                  } catch (_: Exception) {}
              }

              private fun updateShiftStateFromEditor() {
                  if (isCapsLock || isPasswordInput) return
                  val ic = currentInputConnection ?: return
                  val before = ic.getTextBeforeCursor(3, 0)?.toString() ?: ""
                  isShifted = before.isEmpty() || before.endsWith(". ") || before.endsWith("! ") || before.endsWith("? ") || before.endsWith("\n")
              }

              private fun vibrateKey(light: Boolean = false) {
                  val enabled = prefs.getBoolean(KbConfig.KEY_VIBRATE_ENABLED, true)
                  if (!enabled) return
                  val baseDuration = prefs.getInt(KbConfig.KEY_VIBRATE_STRENGTH, 18).toLong().coerceIn(5L, 60L)
                  val dur = if (light) (baseDuration / 2).coerceAtLeast(5L) else baseDuration
                  try {
                      val vib = getSystemService(Context.VIBRATOR_SERVICE) as? Vibrator ?: return
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                          vib.vibrate(VibrationEffect.createOneShot(dur, VibrationEffect.DEFAULT_AMPLITUDE))
                      } else {
                          @Suppress("DEPRECATION")
                          vib.vibrate(dur)
                      }
                  } catch (_: Exception) {}
              }

              private fun roundedBg(hex: String, radiusDp: Float): GradientDrawable {
                  return GradientDrawable().apply {
                      setColor(KbConfig.safeColor(hex))
                      cornerRadius = dp(radiusDp.toInt()).toFloat()
                  }
              }

              private fun dp(value: Int): Int {
                  return TypedValue.applyDimension(
                      TypedValue.COMPLEX_UNIT_DIP,
                      value.toFloat(),
                      resources.displayMetrics
                  ).toInt()
              }
          }
          EOF

          # 9. SetupActivity.kt (import android.graphics.Color eklendi ve tüm ayarlar entegre edildi)
          cat << 'EOF' > app/src/main/java/com/alharitm/uzbekfkeyboard/SetupActivity.kt
          package com.alharitm.uzbekfkeyboard

          import android.app.Activity
          import android.content.Context
          import android.content.Intent
          import android.content.SharedPreferences
          import android.graphics.Color
          import android.graphics.Typeface
          import android.graphics.drawable.GradientDrawable
          import android.os.Bundle
          import android.provider.Settings
          import android.text.InputType
          import android.util.TypedValue
          import android.view.Gravity
          import android.view.View
          import android.view.ViewGroup
          import android.view.inputmethod.InputMethodManager
          import android.widget.Button
          import android.widget.EditText
          import android.widget.LinearLayout
          import android.widget.ScrollView
          import android.widget.SeekBar
          import android.widget.Switch
          import android.widget.TextView

          class SetupActivity : Activity() {
              private lateinit var prefs: SharedPreferences

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  prefs = getSharedPreferences(KbConfig.PREFS_NAME, Context.MODE_PRIVATE)
                  renderSettingsScreen()
              }

              private fun renderSettingsScreen() {
                  val scroll = ScrollView(this).apply {
                      setBackgroundColor(Color.parseColor("#F4F6FA"))
                  }
                  val root = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(dp(18), dp(22), dp(18), dp(40))
                  }

                  val headerCard = cardContainer("#0F172A")
                  val badgeRow = TextView(this).apply {
                      text = "🇺🇿  Ö • Ğ • Ş • Ç • Ў • Қ   |   ARAGON v4.3"
                      setTextColor(Color.parseColor("#38BDF8"))
                      setTextSize(TypedValue.COMPLEX_UNIT_SP, 12f)
                      typeface = Typeface.DEFAULT_BOLD
                  }
                  val title = TextView(this).apply {
                      text = "Oʻzbek F-Klaviatura Pro"
                      setTextSize(TypedValue.COMPLEX_UNIT_SP, 22f)
                      typeface = Typeface.DEFAULT_BOLD
                      setTextColor(Color.WHITE)
                      setPadding(0, dp(4), 0, dp(4))
                  }
                  val sub = TextView(this).apply {
                      text = "Yangi Lotin, Oʻzbek F, QWERTY va Kirill • Popup harf • Parol himoyasi • Katta harflar (130%–200%)"
                      setTextSize(TypedValue.COMPLEX_UNIT_SP, 13f)
                      setTextColor(Color.parseColor("#94A3B8"))
                  }
                  headerCard.addView(badgeRow)
                  headerCard.addView(title)
                  headerCard.addView(sub)
                  root.addView(headerCard)

                  val stepCard = cardContainer("#FFFFFF")
                  stepCard.addView(sectionLabel("1. Klaviaturani faollashtirish va sinash"))
                  val rowBtns = LinearLayout(this).apply { orientation = LinearLayout.HORIZONTAL }

                  val btnEnable = Button(this).apply {
                      text = "1. Yoqish"
                      isAllCaps = false
                      setTextColor(Color.WHITE)
                      background = pillDrawable("#2563EB")
                      layoutParams = LinearLayout.LayoutParams(0, dp(44), 1f).apply { setMargins(0, 0, dp(6), 0) }
                      setOnClickListener { startActivity(Intent(Settings.ACTION_INPUT_METHOD_SETTINGS)) }
                  }
                  val btnSelect = Button(this).apply {
                      text = "2. Tanlash"
                      isAllCaps = false
                      setTextColor(Color.WHITE)
                      background = pillDrawable("#059669")
                      layoutParams = LinearLayout.LayoutParams(0, dp(44), 1f).apply { setMargins(dp(6), 0, 0, 0) }
                      setOnClickListener {
                          val imm = getSystemService(Context.INPUT_METHOD_SERVICE) as InputMethodManager
                          imm.showInputMethodPicker()
                      }
                  }
                  rowBtns.addView(btnEnable)
                  rowBtns.addView(btnSelect)
                  stepCard.addView(rowBtns)

                  val testInput = EditText(this).apply {
                      hint = "✍️ Oddiy matn yozib sinab koʻring (masalan: assalomu)..."
                      setTextColor(Color.parseColor("#0F172A"))
                      setHintTextColor(Color.parseColor("#64748B"))
                      setTextSize(TypedValue.COMPLEX_UNIT_SP, 15f)
                      setPadding(dp(14), dp(12), dp(14), dp(12))
                      background = pillDrawable("#F1F5F9")
                      layoutParams = LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT).apply {
                          setMargins(0, dp(12), 0, dp(6))
                      }
                  }
                  val passInput = EditText(this).apply {
                      hint = "🔒 Parol himoyasini sinab koʻring (yulduzcha rejimi)..."
                      inputType = InputType.TYPE_CLASS_TEXT or InputType.TYPE_TEXT_VARIATION_PASSWORD
                      setTextColor(Color.parseColor("#0F172A"))
                      setHintTextColor(Color.parseColor("#64748B"))
                      setTextSize(TypedValue.COMPLEX_UNIT_SP, 15f)
                      setPadding(dp(14), dp(12), dp(14), dp(12))
                      background = pillDrawable("#FEF2F2")
                  }
                  stepCard.addView(testInput)
                  stepCard.addView(passInput)
                  root.addView(stepCard)

                  val fontCard = cardContainer("#FFFFFF")
                  fontCard.addView(sectionLabel("2. Harf Kattaligi (Standart: 130%, Maksimal: 200%)"))
                  val curFontScale = prefs.getInt(KbConfig.KEY_FONT_SCALE, 130)
                  val fontTitle = TextView(this).apply {
                      text = "Harflar oʻlchami: $curFontScale% (Birlamchi standart: 130%)"
                      setTextSize(TypedValue.COMPLEX_UNIT_SP, 15f)
                      typeface = Typeface.DEFAULT_BOLD
                      setTextColor(Color.parseColor("#0F172A"))
                      setPadding(0, dp(4), 0, dp(6))
                  }
                  fontCard.addView(fontTitle)

                  val seek = SeekBar(this).apply {
                      max = 100
                      progress = (curFontScale - 100).coerceIn(0, 100)
                      setOnSeekBarChangeListener(object : SeekBar.OnSeekBarChangeListener {
                          override fun onProgressChanged(s: SeekBar?, p: Int, fromUser: Boolean) {
                              val scale = 100 + p
                              fontTitle.text = "Harflar oʻlchami: $scale% (Birlamchi standart: 130%)"
                              prefs.edit().putInt(KbConfig.KEY_FONT_SCALE, scale).apply()
                          }
                          override fun onStartTrackingTouch(s: SeekBar?) {}
                          override fun onStopTrackingTouch(s: SeekBar?) {}
                      })
                  }
                  fontCard.addView(seek)

                  val presetRow = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      setPadding(0, dp(8), 0, 0)
                  }
                  listOf("Standart (130%)" to 130, "Katta (155%)" to 155, "👁️ Juda Katta (185%)" to 185).forEach { (lbl, sc) ->
                      val b = Button(this).apply {
                          text = lbl
                          isAllCaps = false
                          setTextSize(TypedValue.COMPLEX_UNIT_SP, 12f)
                          setTextColor(Color.parseColor("#1E293B"))
                          background = pillDrawable("#E2E8F0")
                          layoutParams = LinearLayout.LayoutParams(0, dp(38), 1f).apply { setMargins(dp(3), 0, dp(3), 0) }
                          setOnClickListener {
                              prefs.edit().putInt(KbConfig.KEY_FONT_SCALE, sc).apply()
                              renderSettingsScreen()
                          }
                      }
                      presetRow.addView(b)
                  }
                  fontCard.addView(presetRow)
                  root.addView(fontCard)

                  val layoutCard = cardContainer("#FFFFFF")
                  layoutCard.addView(sectionLabel("3. Klaviatura Joylashuvi (Lotin F, QWERTY va Kirill)"))
                  val activeLayoutId = prefs.getString(KbConfig.KEY_LAYOUT, "uz_f_v10")

                  KbConfig.LAYOUTS.forEach { l ->
                      val isSelected = l.id == activeLayoutId
                      val btn = Button(this).apply {
                          text = if (isSelected) "✅  ${l.title}" else "⚪  ${l.title}"
                          isAllCaps = false
                          gravity = Gravity.START or Gravity.CENTER_VERTICAL
                          setPadding(dp(14), dp(10), dp(14), dp(10))
                          setTextColor(if (isSelected) Color.WHITE else Color.parseColor("#1E293B"))
                          background = pillDrawable(if (isSelected) "#2563EB" else "#F1F5F9")
                          layoutParams = LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT).apply {
                              setMargins(0, dp(4), 0, dp(4))
                          }
                          setOnClickListener {
                              prefs.edit().putString(KbConfig.KEY_LAYOUT, l.id).apply()
                              renderSettingsScreen()
                          }
                      }
                      layoutCard.addView(btn)
                  }
                  root.addView(layoutCard)

                  val prefCard = cardContainer("#FFFFFF")
                  prefCard.addView(sectionLabel("4. Tugma Harakati, Haptik va Imlo"))
                  prefCard.addView(switchRow("Bosilganda harfni tepada chiqarish (Popup)", "Videodagi kabi bosilgan harf kattalashib koʻrinadi", KbConfig.KEY_POPUP_PREVIEW, true))
                  prefCard.addView(switchRow("Oʻzbek imlo tekshiruvi va 'Geri al'", "Xato soʻzlarni toʻgʻrilaydi va qaytarish tugmasini chiqaradi", KbConfig.KEY_AUTO_CORRECT, true))
                  prefCard.addView(switchRow("Haptik aloqa (Vibratsiya)", "Tugma bosilganda yengil tebranish", KbConfig.KEY_VIBRATE_ENABLED, true))
                  prefCard.addView(switchRow("Raqamlar qatori (1–0)", "Yuqorida raqamlarni doimiy koʻrsatish", KbConfig.KEY_NUM_ROW, true))
                  prefCard.addView(switchRow("Til almashtirish tugmasi (🌐)", "Lotin va Kirill orasida tezkor oʻtish", KbConfig.KEY_LANG_KEY, true))
                  root.addView(prefCard)

                  val themeCard = cardContainer("#FFFFFF")
                  themeCard.addView(sectionLabel("5. Mavzular va Ranglar (Theme)"))
                  val activeThemeId = prefs.getString(KbConfig.KEY_THEME, "default_dark")

                  KbConfig.THEMES.chunked(2).forEach { pair ->
                      val r = LinearLayout(this).apply { orientation = LinearLayout.HORIZONTAL }
                      pair.forEach { t ->
                          val selected = t.id == activeThemeId
                          val b = Button(this).apply {
                              text = if (selected) "✓ ${t.name}" else t.name
                              isAllCaps = false
                              setTextColor(KbConfig.safeColor(t.keyText))
                              background = GradientDrawable().apply {
                                  setColor(KbConfig.safeColor(t.boardBg))
                                  cornerRadius = dp(12).toFloat()
                                  setStroke(dp(if (selected) 3 else 1), if (selected) Color.parseColor("#2563EB") else Color.parseColor("#CBD5E1"))
                              }
                              layoutParams = LinearLayout.LayoutParams(0, dp(52), 1f).apply {
                                  setMargins(dp(4), dp(4), dp(4), dp(4))
                              }
                              setOnClickListener {
                                  prefs.edit().putString(KbConfig.KEY_THEME, t.id).apply()
                                  renderSettingsScreen()
                              }
                          }
                          r.addView(b)
                      }
                      themeCard.addView(r)
                  }
                  root.addView(themeCard)

                  scroll.addView(root)
                  setContentView(scroll)
              }

              private fun switchRow(titleText: String, subText: String, prefKey: String, defaultVal: Boolean): View {
                  val row = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      gravity = Gravity.CENTER_VERTICAL
                      setPadding(0, dp(8), 0, dp(8))
                  }
                  val textCol = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      layoutParams = LinearLayout.LayoutParams(0, ViewGroup.LayoutParams.WRAP_CONTENT, 1f)
                  }
                  val t = TextView(this).apply {
                      text = titleText
                      setTextSize(TypedValue.COMPLEX_UNIT_SP, 14.5f)
                      typeface = Typeface.DEFAULT_BOLD
                      setTextColor(Color.parseColor("#0F172A"))
                  }
                  val s = TextView(this).apply {
                      text = subText
                      setTextSize(TypedValue.COMPLEX_UNIT_SP, 12f)
                      setTextColor(Color.parseColor("#64748B"))
                  }
                  textCol.addView(t)
                  textCol.addView(s)

                  val sw = Switch(this).apply {
                      isChecked = prefs.getBoolean(prefKey, defaultVal)
                      setOnCheckedChangeListener { _, isChecked ->
                          prefs.edit().putBoolean(prefKey, isChecked).apply()
                      }
                  }
                  row.addView(textCol)
                  row.addView(sw)
                  return row
              }

              private fun cardContainer(bgHex: String): LinearLayout {
                  return LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(dp(16), dp(16), dp(16), dp(16))
                      background = pillDrawable(bgHex, 16f)
                      layoutParams = LinearLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT,
                          ViewGroup.LayoutParams.WRAP_CONTENT
                      ).apply { setMargins(0, 0, 0, dp(14)) }
                  }
              }

              private fun sectionLabel(txt: String): TextView {
                  return TextView(this).apply {
                      text = txt
                      setTextSize(TypedValue.COMPLEX_UNIT_SP, 13f)
                      typeface = Typeface.DEFAULT_BOLD
                      setTextColor(Color.parseColor("#2563EB"))
                      setPadding(0, 0, 0, dp(8))
                  }
              }

              private fun pillDrawable(hex: String, radiusDp: Float = 12f): GradientDrawable {
                  return GradientDrawable().apply {
                      setColor(KbConfig.safeColor(hex))
                      cornerRadius = dp(radiusDp.toInt()).toFloat()
                  }
              }

              private fun dp(v: Int): Int {
                  return TypedValue.applyDimension(
                      TypedValue.COMPLEX_UNIT_DIP,
                      v.toFloat(),
                      resources.displayMetrics
                  ).toInt()
              }
          }
