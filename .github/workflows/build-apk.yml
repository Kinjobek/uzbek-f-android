              private fun createSwitchRow(title: String, subtitle: String, checked: Boolean, onToggle: (Boolean) -> Unit): View {
                  val row = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      gravity = Gravity.CENTER_VERTICAL
                      setPadding(0, dp(8), 0, dp(8))
                  }
                  val textCol = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      layoutParams = LinearLayout.LayoutParams(0, ViewGroup.LayoutParams.WRAP_CONTENT, 1f)
                  }
                  val tView = TextView(this).apply {
                      text = title
                      setTextSize(TypedValue.COMPLEX_UNIT_SP, 14f)
                      typeface = Typeface.DEFAULT_BOLD
                      setTextColor(KbConfig.safeColor("#0F172A"))
                  }
                  val sView = TextView(this).apply {
                      text = subtitle
                      setTextSize(TypedValue.COMPLEX_UNIT_SP, 11f)
                      setTextColor(KbConfig.safeColor("#64748B"))
                  }
                  textCol.addView(tView)
                  textCol.addView(sView)

                  val sw = Switch(this).apply {
                      isChecked = checked
                      setOnCheckedChangeListener { _, isChecked -> onToggle(isChecked) }
                  }
                  row.addView(textCol)
                  row.addView(sw)
                  return row
              }

              private fun roundRect(hex: String, radiusPx: Int): GradientDrawable {
                  return GradientDrawable().apply {
                      cornerRadius = radiusPx.toFloat()
                      setColor(KbConfig.safeColor(hex))
                  }
              }

              private fun dp(v: Int): Int = (v * resources.displayMetrics.density).toInt()
